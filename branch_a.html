<!DOCTYPE html>

<!-- Born of high heavens, where pure light is shed,
I am the life of the holy and dread.
Though mortals may perish when wounds run too deep,
A drop of my essence wakes those in death's sleep.

What am I? -->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_HUB // BRANCH_A_SECTOR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #D7A000;
            color: #000000;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 50px;
            overflow: hidden;
            user-select: none;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #000000;
            padding-bottom: 15px;
        }

        .system-title {
            font-size: 20px;
            font-weight: bold;
        }

        .user-hud {
            font-size: 16px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .color-indicator {
            width: 15px;
            height: 15px;
            display: inline-block;
            border: 1px solid #000000;
        }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 20px 0;
        }

        canvas {
            background-color: #b58600;
            border: 4px solid #000000;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .controls-hint {
            font-size: 14px;
            text-align: center;
            background: rgba(0, 0, 0, 0.1);
            padding: 10px;
            border: 1px solid rgba(0, 0, 0, 0.3);
        }

        .back-link {
            color: #000000;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .back-link:hover {
            color: #333333;
        }

        #loginGate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #D7A000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .portal-box {
            background: rgba(255, 255, 255, 0.2);
            border: 2px dashed #000000;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        input[type="text"] {
            background: transparent;
            border: 2px solid #000000;
            color: #000000;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
        }

        input::placeholder {
            color: rgba(0, 0, 0, 0.6);
        }

        button {
            background: #000000;
            color: #D7A000;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #333333;
        }

        .error-text {
            color: #550000;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- LOGIN GATE OVERLAY -->
    <div id="loginGate">
        <div class="portal-box">
            <div style="font-size: 24px; margin-bottom: 15px;">:(</div>
            <div style="font-size: 18px; margin-bottom: 20px;">[INITIALIZING BRANCH_A PROTOCOL]</div>
            <div style="font-size: 14px; margin-bottom: 10px; text-align: left;">ENTER AUTHORIZED SEEKER ID:</div>
            <input type="text" id="gateUsername" placeholder="e.g. Mneme_seeker">
            <button onclick="enterHub()">CONNECT TO SECTOR</button>
            <div id="gateError" class="error-text"></div>
        </div>
    </div>

    <!-- ROOM MAIN INTERFACE -->
    <div class="header-panel">
        <div class="system-title">CHAMBER_STATUS: BRANCH_A [OBSTACLE COURSE - CLOUD SYNC ACTIVE]</div>
        <div class="user-hud">
            <span>SEEKER: <strong id="hudUser">---</strong></span>
            <span>TRAUMA SUIT: <strong id="hudSuit">---</strong></span>
            <span>COLOR CODE: <span class="color-indicator" id="hudColorBox"></span></span>
            <span class="back-link" onclick="returnToDoer2()">[RETURN TO DOOR 2]</span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="hubCanvas" width="900" height="450"></canvas>
    </div>

    <div class="controls-hint">
        CONTROLS: Use <strong>A / D</strong> or <strong>LEFT / RIGHT</strong> to move, <strong>W / SPACE / UP</strong> to jump.
    </div>

    <!-- Firebase SDK & Multiplayer Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlgsx3uuat9oi2vwntXhInUcAe8N-veLY",
            authDomain: "enter-f1c88.firebaseapp.com",
            projectId: "enter-f1c88",
            storageBucket: "enter-f1c88.appspot.com",
            messagingSenderId: "794692963928",
            appId: "1:794692963928:web:83fed114aed9389bf3042d",
            measurementId: "G-PFGVSW5598"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const validUsers = [
            "Mneme_seeker", "Mirror_seeker", "Written_seeker", 
            "Faded_seeker", "Dule_Seeker", "Old_seeker", 
            "Strong_seeker", "Weaveshaper_seeker", "Fabled_seeker",
            "Prince_seeker"
        ];

        const seekerColors = {
            "Prince_seeker": "#FFFF00",
            "Mneme_seeker": "#ff3366",
            "Mirror_seeker": "#008080",
            "Written_seeker": "#800080",
            "Faded_seeker": "#555555",
            "Dule_Seeker": "#ff6600",
            "Old_seeker": "#4b0082",
            "Strong_seeker": "#006600",
            "Weaveshaper_seeker": "#000088",
            "Fabled_seeker": "#cc00cc"
        };

        let activeUser = "";
        let activeSuit = "Unallocated";
        let playerColor = "#000000";

        window.enterHub = async function() {
            const inputVal = document.getElementById('gateUsername').value.trim();
            const errorDiv = document.getElementById('gateError');
            const matchedUser = validUsers.find(u => u.toLowerCase() === inputVal.toLowerCase());

            if (!matchedUser) {
                errorDiv.textContent = "ERROR 0x80070002: Unknown Seeker ID profile.";
                return;
            }

            activeUser = matchedUser;
            
            try {
                const docSnap = await getDoc(doc(db, "trauma_suits", "allocations"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    for (const [suit, user] of Object.entries(data)) {
                        if (user.toLowerCase() === activeUser.toLowerCase()) {
                            activeSuit = suit;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.error("Could not fetch suit data", e);
            }

            playerColor = seekerColors[activeUser] || "#000000";

            document.getElementById('hudUser').textContent = activeUser;
            document.getElementById('hudSuit').textContent = activeSuit;
            document.getElementById('hudColorBox').style.backgroundColor = playerColor;

            document.getElementById('loginGate').style.display = 'none';
            startPlatformerEngine();
        }

        window.returnToDoer2 = function() {
            window.location.href = "door2.html";
        }

        function startPlatformerEngine() {
            const canvas = document.getElementById('hubCanvas');
            const ctx = canvas.getContext('2d');

            let player = {
                x: 50,
                y: 350,
                width: 24,
                height: 36,
                vx: 0,
                vy: 0,
                speed: 4,
                jumpForce: -10,
                grounded: false
            };

            // Level layout leading to continuous ground and then the hidden pit drop
            const platforms = [
                { x: 0, y: 410, w: 900, h: 40 },   // Continuous solid ground across the entire floor
                { x: 250, y: 320, w: 120, h: 20 },  // Platform 1
                { x: 430, y: 240, w: 120, h: 20 },  // Platform 2
                { x: 610, y: 170, w: 120, h: 20 }   // Platform 3
            ];

            // Invisible Pit positioned along the ground near the far right end
            const pit = { x: 780, y: 410, w: 60, h: 40, url: "Pit.html" };

            const gravity = 0.5;
            const keys = {};

            window.addEventListener('keydown', (e) => {
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space", "KeyA", "KeyD", "KeyW"].includes(e.code)) {
                    e.preventDefault();
                }
                keys[e.code] = true;
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            let lastSync = 0;
            async function syncPositionToCloud(force = false) {
                const now = Date.now();
                if (force || now - lastSync > 100) {
                    lastSync = now;
                    try {
                        await setDoc(doc(db, "branch_a_players", activeUser), {
                            user: activeUser,
                            x: player.x,
                            y: player.y,
                            color: playerColor,
                            suit: activeSuit,
                            lastUpdated: now
                        }, { merge: true });
                    } catch (e) {
                        console.error("Sync error:", e);
                    }
                }
            }

            let peers = {};
            onSnapshot(collection(db, "branch_a_players"), (snapshot) => {
                const now = Date.now();
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.user !== activeUser && docSnap.id !== activeUser) {
                        if (now - data.lastUpdated < 4000) {
                            peers[docSnap.id] = data;
                        } else {
                            delete peers[docSnap.id];
                        }
                    }
                });
            });

            function update() {
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    player.vx = -player.speed;
                } else if (keys['ArrowRight'] || keys['KeyD']) {
                    player.vx = player.speed;
                } else {
                    player.vx *= 0.8;
                }

                player.vy += gravity;

                if ((keys['ArrowUp'] || keys['Space'] || keys['KeyW']) && player.grounded) {
                    player.vy = player.jumpForce;
                    player.grounded = false;
                }

                player.x += player.vx;
                if (player.x < 0) player.x = 0;
                if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

                player.y += player.vy;
                player.grounded = false;

                // Check collisions with platforms, treating the pit zone as open air
                platforms.forEach(plat => {
                    // If the platform is the main floor, split it to create the invisible pit gap
                    if (plat.y === 410) {
                        // Left side of ground before pit, or right side after pit
                        if (player.x + player.width > plat.x && player.x < pit.x || player.x > pit.x + pit.w && player.x < plat.x + plat.w) {
                            if (
                                player.y + player.height > plat.y &&
                                player.y + player.height - player.vy <= plat.y + 5
                            ) {
                                player.y = plat.y - player.height;
                                player.vy = 0;
                                player.grounded = true;
                            }
                        }
                    } else {
                        // Normal elevated platforms
                        if (
                            player.x < plat.x + plat.w &&
                            player.x + player.width > plat.x &&
                            player.y + player.height > plat.y &&
                            player.y + player.height - player.vy <= plat.y + 5
                        ) {
                            player.y = plat.y - player.height;
                            player.vy = 0;
                            player.grounded = true;
                        }
                    }
                });

                // Check collision with the invisible pit trapdoor zone
                if (
                    player.x + (player.width / 2) > pit.x &&
                    player.x + (player.width / 2) < pit.x + pit.w &&
                    player.y + player.height >= pit.y
                ) {
                    window.location.href = pit.url;
                }

                if (player.y + player.height > canvas.height && !(player.x + (player.width / 2) > pit.x && player.x + (player.width / 2) < pit.x + pit.w)) {
                    player.y = canvas.height - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }

                syncPositionToCloud();
            }

            function draw() {
                ctx.fillStyle = "#b58600";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Platforms & Continuous Ground (with an invisible gap over the pit)
                ctx.fillStyle = "#000000";
                platforms.forEach(plat => {
                    if (plat.y === 410) {
                        // Draw floor up to the pit
                        ctx.fillRect(plat.x, plat.y, pit.x - plat.x, plat.h);
                        // Draw floor after the pit
                        ctx.fillRect(pit.x + pit.w, plat.y, (plat.x + plat.w) - (pit.x + pit.w), plat.h);
                    } else {
                        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    }
                });

                // Draw Peers
                for (const [peerName, pData] of Object.entries(peers)) {
                    ctx.fillStyle = pData.color || "#000000";
                    ctx.fillRect(pData.x, pData.y, 24, 36);

                    ctx.fillStyle = "#000000";
                    ctx.font = "10px 'Courier New'";
                    ctx.textAlign = "center";
                    ctx.fillText(`${peerName} [${pData.suit}]`, pData.x + 12, pData.y - 6);
                }

                // Draw Local Player
                ctx.fillStyle = playerColor;
                ctx.fillRect(player.x, player.y, player.width, player.height);

                ctx.fillStyle = "#000000";
                ctx.font = "11px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(`${activeUser} (YOU)`, player.x + (player.width / 2), player.y - 8);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            loop();
        }
    </script>
</body>
</html>
