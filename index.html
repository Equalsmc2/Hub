<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_HUB // SYSTEM_ALLOCATED_ZONE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0078D7;
            color: #FFFFFF;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 50px;
            overflow: hidden;
            user-select: none;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #FFFFFF;
            padding-bottom: 15px;
        }

        .system-title {
            font-size: 20px;
            font-weight: bold;
        }

        .user-hud {
            font-size: 16px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .color-indicator {
            width: 15px;
            height: 15px;
            display: inline-block;
            border: 1px solid #FFFFFF;
        }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 20px 0;
        }

        canvas {
            background-color: #00458a;
            border: 4px solid #FFFFFF;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .controls-hint {
            font-size: 14px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .back-link {
            color: #FFFFFF;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .back-link:hover {
            color: #d1e7ff;
        }

        #loginGate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0078D7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .portal-box {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed #FFFFFF;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        input[type="text"] {
            background: transparent;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        button {
            background: #FFFFFF;
            color: #0078D7;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #e0e0e0;
        }

        .error-text {
            color: #ffcccc;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- LOGIN GATE OVERLAY -->
    <div id="loginGate">
        <div class="portal-box">
            <div style="font-size: 24px; margin-bottom: 15px;">:(</div>
            <div style="font-size: 18px; margin-bottom: 20px;">[INITIALIZING THE_HUB ACCESS PROTOCOL]</div>
            <div style="font-size: 14px; margin-bottom: 10px; text-align: left;">ENTER AUTHORIZED SEEKER ID:</div>
            <input type="text" id="gateUsername" placeholder="e.g. Mneme_seeker">
            <button onclick="enterHub()">CONNECT TO THE HUB</button>
            <div id="gateError" class="error-text"></div>
        </div>
    </div>

    <!-- HUB MAIN INTERFACE -->
    <div class="header-panel">
        <div class="system-title">KERNEL_STATUS: THE_HUB [CLOUD SYNC ACTIVE]</div>
        <div class="user-hud">
            <span>SEEKER: <strong id="hudUser">---</strong></span>
            <span>TRAUMA SUIT: <strong id="hudSuit">---</strong></span>
            <span>COLOR CODE: <span class="color-indicator" id="hudColorBox"></span></span>
            <span class="back-link" onclick="logoutHub()">[DISCONNECT]</span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="hubCanvas" width="800" height="450"></canvas>
    </div>

    <div class="controls-hint">
        CONTROLS: Use <strong>A / D</strong> or <strong>LEFT / RIGHT</strong> to move, <strong>W / SPACE / UP</strong> to jump. Walk into a door and press <strong>UP</strong> to enter.
    </div>

    <!-- Firebase SDK & Multiplayer Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlgsx3uuat9oi2vwntXhInUcAe8N-veLY",
            authDomain: "enter-f1c88.firebaseapp.com",
            projectId: "enter-f1c88",
            storageBucket: "enter-f1c88.appspot.com",
            messagingSenderId: "794692963928",
            appId: "1:794692963928:web:83fed114aed9389bf3042d",
            measurementId: "G-PFGVSW5598"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const validUsers = [
            "Mneme_seeker", "Mirror_seeker", "Written_seeker", 
            "Faded_seeker", "Dule_Seeker", "Old_seeker", 
            "Strong_seeker", "Weaveshaper_seeker", "Fabled_seeker"
        ];

        const seekerColors = {
            "Mneme_seeker": "#ff3366",
            "Mirror_seeker": "#33ffcc",
            "Written_seeker": "#ffcc00",
            "Faded_seeker": "#b8b8b8",
            "Dule_Seeker": "#ff6600",
            "Old_seeker": "#9933ff",
            "Strong_seeker": "#33cc33",
            "Weaveshaper_seeker": "#3399ff",
            "Fabled_seeker": "#ff33ff"
        };

        let activeUser = "";
        let activeSuit = "Unallocated";
        let playerColor = "#FFFFFF";

        window.enterHub = async function() {
            const inputVal = document.getElementById('gateUsername').value.trim();
            const errorDiv = document.getElementById('gateError');
            const matchedUser = validUsers.find(u => u.toLowerCase() === inputVal.toLowerCase());

            if (!matchedUser) {
                errorDiv.textContent = "ERROR 0x80070002: Unknown Seeker ID profile.";
                return;
            }

            activeUser = matchedUser;
            
            try {
                const docSnap = await getDoc(doc(db, "trauma_suits", "allocations"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    for (const [suit, user] of Object.entries(data)) {
                        if (user.toLowerCase() === activeUser.toLowerCase()) {
                            activeSuit = suit;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.error("Could not fetch suit data", e);
            }

            playerColor = seekerColors[activeUser] || "#FFFFFF";

            document.getElementById('hudUser').textContent = activeUser;
            document.getElementById('hudSuit').textContent = activeSuit;
            document.getElementById('hudColorBox').style.backgroundColor = playerColor;

            document.getElementById('loginGate').style.display = 'none';
            startPlatformerEngine();
        }

        window.logoutHub = function() {
            location.reload();
        }

        function startPlatformerEngine() {
            const canvas = document.getElementById('hubCanvas');
            const ctx = canvas.getContext('2d');

            let player = {
                x: 100,
                y: 300,
                width: 24,
                height: 36,
                vx: 0,
                vy: 0,
                speed: 4,
                jumpForce: -10,
                grounded: false
            };

            const platforms = [
                { x: 0, y: 410, w: 800, h: 40 },   // Floor
                { x: 100, y: 310, w: 180, h: 20 },  // Left platform
                { x: 310, y: 230, w: 180, h: 20 },  // Middle platform
                { x: 520, y: 310, w: 180, h: 20 }   // Right platform
            ];

            // Three structural doors placed on top of the platforms
            const doors = [
                { x: 170, y: 230, w: 40, h: 80, label: "DOOR 1", url: "door1.html" },
                { x: 380, y: 150, w: 40, h: 80, label: "DOOR 2", url: "door2.html" },
                { x: 590, y: 230, w: 40, h: 80, label: "DOOR 3", url: "door3.html" }
            ];

            const gravity = 0.5;
            const keys = {};

            window.addEventListener('keydown', (e) => {
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space", "KeyA", "KeyD", "KeyW"].includes(e.code)) {
                    e.preventDefault();
                }
                keys[e.code] = true;

                // Check door interaction when pressing Up / W inside a door boundary
                if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
                    doors.forEach(door => {
                        if (
                            player.x < door.x + door.w &&
                            player.x + player.width > door.x &&
                            player.y < door.y + door.h &&
                            player.y + player.height > door.y
                        ) {
                            // Redirect to respective door page
                            window.location.href = door.url;
                        }
                    });
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            let lastSync = 0;
            async function syncPositionToCloud(force = false) {
                const now = Date.now();
                if (force || now - lastSync > 100) {
                    lastSync = now;
                    try {
                        await setDoc(doc(db, "hub_players", activeUser), {
                            x: player.x,
                            y: player.y,
                            color: playerColor,
                            suit: activeSuit,
                            lastUpdated: now
                        }, { merge: true });
                    } catch (e) {
                        console.error("Sync error:", e);
                    }
                }
            }

            let peers = {};
            onSnapshot(collection(db, "hub_players"), (snapshot) => {
                const now = Date.now();
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.user !== activeUser && docSnap.id !== activeUser) {
                        if (now - data.lastUpdated < 4000) {
                            peers[docSnap.id] = data;
                        } else {
                            delete peers[docSnap.id];
                        }
                    }
                });
            });

            function update() {
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    player.vx = -player.speed;
                } else if (keys['ArrowRight'] || keys['KeyD']) {
                    player.vx = player.speed;
                } else {
                    player.vx *= 0.8;
                }

                player.vy += gravity;

                if ((keys['ArrowUp'] || keys['Space'] || keys['KeyW']) && player.grounded) {
                    // Prevent jumping if interacting with a door directly underneath us
                    let enteringDoor = false;
                    doors.forEach(door => {
                        if (
                            player.x < door.x + door.w &&
                            player.x + player.width > door.x &&
                            player.y + player.height >= door.y &&
                            player.y <= door.y + door.h
                        ) {
                            enteringDoor = true;
                        }
                    });

                    if (!enteringDoor) {
                        player.vy = player.jumpForce;
                        player.grounded = false;
                    }
                }

                player.x += player.vx;
                if (player.x < 0) player.x = 0;
                if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

                player.y += player.vy;
                player.grounded = false;

                platforms.forEach(plat => {
                    if (
                        player.x < plat.x + plat.w &&
                        player.x + player.width > plat.x &&
                        player.y + player.height > plat.y &&
                        player.y + player.height - player.vy <= plat.y + 5
                    ) {
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                });

                if (player.y + player.height > canvas.height) {
                    player.y = canvas.height - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }

                syncPositionToCloud();
            }

            function draw() {
                ctx.fillStyle = "#00458a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Doors
                doors.forEach(door => {
                    ctx.fillStyle = "#002b5c";
                    ctx.fillRect(door.x, door.y, door.w, door.h);
                    ctx.strokeStyle = "#FFFFFF";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(door.x, door.y, door.w, door.h);

                    // Door Label Text
                    ctx.fillStyle = "#FFFFFF";
                    ctx.font = "10px 'Courier New'";
                    ctx.textAlign = "center";
                    ctx.fillText(door.label, door.x + (door.w / 2), door.y - 6);
                });

                // Draw Platforms
                ctx.fillStyle = "#FFFFFF";
                platforms.forEach(plat => {
                    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                });

                // Draw Peers
                for (const [peerName, pData] of Object.entries(peers)) {
                    ctx.fillStyle = pData.color || "#FFFFFF";
                    ctx.fillRect(pData.x, pData.y, 24, 36);

                    ctx.fillStyle = "#FFFFFF";
                    ctx.font = "10px 'Courier New'";
                    ctx.textAlign = "center";
                    ctx.fillText(`${peerName} [${pData.suit}]`, pData.x + 12, pData.y - 6);
                }

                // Draw Local Player
                ctx.fillStyle = playerColor;
                ctx.fillRect(player.x, player.y, player.width, player.height);

                ctx.fillStyle = "#FFFFFF";
                ctx.font = "11px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(`${activeUser} (YOU)`, player.x + (player.width / 2), player.y - 8);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            loop();
        }
    </script>
</body>
</html>
