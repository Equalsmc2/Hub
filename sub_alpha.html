<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_HUB // SECTOR_ALPHA_BOSS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #550000;
            color: #FF5555;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 50px;
            overflow: hidden;
            user-select: none;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #FF5555;
            padding-bottom: 15px;
        }

        .system-title {
            font-size: 20px;
            font-weight: bold;
        }

        .user-hud {
            font-size: 16px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .color-indicator {
            width: 15px;
            height: 15px;
            display: inline-block;
            border: 1px solid #FF5555;
        }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 20px 0;
        }

        canvas {
            background-color: #330000;
            border: 4px solid #FF5555;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }

        .controls-hint {
            font-size: 14px;
            text-align: center;
            background: rgba(255, 0, 0, 0.1);
            padding: 10px;
            border: 1px solid rgba(255, 85, 85, 0.3);
        }

        .back-link {
            color: #FF5555;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .back-link:hover {
            color: #FFFFFF;
        }

        #loginGate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #550000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .portal-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #FF5555;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        input[type="text"] {
            background: transparent;
            border: 2px solid #FF5555;
            color: #FF5555;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
        }

        input::placeholder {
            color: rgba(255, 85, 85, 0.5);
        }

        button {
            background: #FF5555;
            color: #550000;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #FFFFFF;
        }

        .error-text {
            color: #FFAAAA;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- LOGIN GATE OVERLAY -->
    <div id="loginGate">
        <div class="portal-box">
            <div style="font-size: 24px; margin-bottom: 15px; color: #FF5555;">:(</div>
            <div style="font-size: 18px; margin-bottom: 20px; color: #FF5555;">[INITIALIZING SECTOR_ALPHA PROTOCOL]</div>
            <div style="font-size: 14px; margin-bottom: 10px; text-align: left; color: #FF5555;">ENTER AUTHORIZED SEEKER ID:</div>
            <input type="text" id="gateUsername" placeholder="e.g. Mneme_seeker">
            <button onclick="enterBossFight()">SURVIVE ONSLAUGHT</button>
            <div id="gateError" class="error-text"></div>
        </div>
    </div>

    <!-- ROOM MAIN INTERFACE -->
    <div class="header-panel">
        <div class="system-title">CHAMBER_STATUS: SECTOR_ALPHA [SURVIVAL TRIAL - 60 SECONDS]</div>
        <div class="user-hud">
            <span>SEEKER: <strong id="hudUser">---</strong></span>
            <span>TRAUMA SUIT: <strong id="hudSuit">---</strong></span>
            <span>COLOR CODE: <span class="color-indicator" id="hudColorBox"></span></span>
            <span class="back-link" onclick="returnToDoor3()">[RETURN TO DOOR 3]</span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="hubCanvas" width="900" height="450"></canvas>
    </div>

    <div class="controls-hint">
        OBJECTIVE: Survive for <strong>60 seconds</strong> against high-speed corruption waves. Use <strong>A / D</strong> and jump carefully.
    </div>

    <!-- Firebase SDK & Multiplayer Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlgsx3uuat9oi2vwntXhInUcAe8N-veLY",
            authDomain: "enter-f1c88.firebaseapp.com",
            projectId: "enter-f1c88",
            storageBucket: "enter-f1c88.appspot.com",
            messagingSenderId: "794692963928",
            appId: "1:794692963928:web:83fed114aed9389bf3042d",
            measurementId: "G-PFGVSW5598"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const validUsers = [
            "Mneme_seeker", "Mirror_seeker", "Written_seeker", 
            "Faded_seeker", "Dule_Seeker", "Old_seeker", 
            "Strong_seeker", "Weaveshaper_seeker", "Fabled_seeker",
            "Prince_seeker"
        ];

        const seekerColors = {
            "Mneme_seeker": "#ff3366",
            "Mirror_seeker": "#33ffcc",
            "Written_seeker": "#ffcc00",
            "Faded_seeker": "#b8b8b8",
            "Dule_Seeker": "#ff6600",
            "Old_seeker": "#9933ff",
            "Strong_seeker": "#33cc33",
            "Weaveshaper_seeker": "#3399ff",
            "Fabled_seeker": "#ff33ff",
            "Prince_seeker": "#FFFF00"
        };

        let activeUser = "";
        let activeSuit = "Unallocated";
        let playerColor = "#FF5555";

        window.enterBossFight = async function() {
            const inputVal = document.getElementById('gateUsername').value.trim();
            const errorDiv = document.getElementById('gateError');
            const matchedUser = validUsers.find(u => u.toLowerCase() === inputVal.toLowerCase());

            if (!matchedUser) {
                errorDiv.textContent = "ERROR 0x80070002: Unknown Seeker ID profile.";
                return;
            }

            activeUser = matchedUser;
            
            try {
                const docSnap = await getDoc(doc(db, "trauma_suits", "allocations"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    for (const [suit, user] of Object.entries(data)) {
                        if (user.toLowerCase() === activeUser.toLowerCase()) {
                            activeSuit = suit;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.error("Could not fetch suit data", e);
            }

            playerColor = seekerColors[activeUser] || "#FF5555";

            document.getElementById('hudUser').textContent = activeUser;
            document.getElementById('hudSuit').textContent = activeSuit;
            document.getElementById('hudColorBox').style.backgroundColor = playerColor;

            document.getElementById('loginGate').style.display = 'none';
            startSurvivalEngine();
        }

        window.returnToDoor3 = function() {
            window.location.href = "door3.html";
        }

        function startSurvivalEngine() {
            const canvas = document.getElementById('hubCanvas');
            const ctx = canvas.getContext('2d');

            let player = {
                x: 100,
                y: 350,
                width: 24,
                height: 36,
                vx: 0,
                vy: 0,
                speed: 4.5,
                jumpForce: -10.5,
                grounded: false,
                hp: 100
            };

            let boss = {
                x: 400,
                y: 80,
                width: 120,
                height: 80,
                vx: 3.5,
                attackTimer: 0
            };

            let projectiles = [];
            let startTime = Date.now();
            let survivalDuration = 60000; // 60 seconds
            let trialWon = false;

            const platforms = [
                { x: 0, y: 410, w: 900, h: 40 },   // Main floor
                { x: 150, y: 310, w: 120, h: 20 },
                { x: 400, y: 230, w: 100, h: 20 },
                { x: 630, y: 310, w: 120, h: 20 }
            ];

            const gravity = 0.55;
            const keys = {};

            window.addEventListener('keydown', (e) => {
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space", "KeyA", "KeyD", "KeyW"].includes(e.code)) {
                    e.preventDefault();
                }
                keys[e.code] = true;
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            let lastSync = 0;
            async function syncPositionToCloud(force = false) {
                const now = Date.now();
                if (force || now - lastSync > 100) {
                    lastSync = now;
                    try {
                        await setDoc(doc(db, "boss_alpha_players", activeUser), {
                            user: activeUser,
                            x: player.x,
                            y: player.y,
                            color: playerColor,
                            suit: activeSuit,
                            hp: player.hp,
                            lastUpdated: now
                        }, { merge: true });
                    } catch (e) {
                        console.error("Sync error:", e);
                    }
                }
            }

            let peers = {};
            onSnapshot(collection(db, "boss_alpha_players"), (snapshot) => {
                const now = Date.now();
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.user !== activeUser && docSnap.id !== activeUser) {
                        if (now - data.lastUpdated < 4000) {
                            peers[docSnap.id] = data;
                        } else {
                            delete peers[docSnap.id];
                        }
                    }
                });
            });

            function update() {
                if (trialWon) return;

                let elapsedTime = Date.now() - startTime;
                if (elapsedTime >= survivalDuration) {
                    trialWon = true;
                    setTimeout(() => {
                        window.location.href = "victory_alpha.html";
                    }, 2000);
                    return;
                }

                // Player movement
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    player.vx = -player.speed;
                } else if (keys['ArrowRight'] || keys['KeyD']) {
                    player.vx = player.speed;
                } else {
                    player.vx *= 0.8;
                }

                player.vy += gravity;

                if ((keys['ArrowUp'] || keys['Space'] || keys['KeyW']) && player.grounded) {
                    player.vy = player.jumpForce;
                    player.grounded = false;
                }

                player.x += player.vx;
                if (player.x < 0) player.x = 0;
                if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

                player.y += player.vy;
                player.grounded = false;

                platforms.forEach(plat => {
                    if (
                        player.x < plat.x + plat.w &&
                        player.x + player.width > plat.x &&
                        player.y + player.height > plat.y &&
                        player.y + player.height - player.vy <= plat.y + 5
                    ) {
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                });

                if (player.y + player.height > canvas.height) {
                    player.y = canvas.height - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }

                // Aggressive Boss Movement
                boss.x += boss.vx;
                if (boss.x < 40 || boss.x + boss.width > canvas.width - 40) {
                    boss.vx *= -1;
                }

                // High-frequency barrage attack
                boss.attackTimer++;
                if (boss.attackTimer > 20) { // Fires much faster now
                    boss.attackTimer = 0;
                    // Burst of 3 projectiles per volley
                    for (let i = 0; i < 3; i++) {
                        projectiles.push({
                            x: boss.x + (boss.width / 2) - 8,
                            y: boss.y + boss.height,
                            vx: (Math.random() - 0.5) * 7,
                            vy: 3 + Math.random() * 3,
                            w: 14,
                            h: 14
                        });
                    }
                }

                // Update Projectiles
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    let p = projectiles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    // Severe damage on impact (25 HP loss)
                    if (
                        player.x < p.x + p.w &&
                        player.x + player.width > p.x &&
                        player.y < p.y + p.h &&
                        player.y + player.height > p.y
                    ) {
                        player.hp -= 25;
                        projectiles.splice(i, 1);
                        if (player.hp <= 0) {
                            // Reset trial timer and health on death
                            player.hp = 100;
                            player.x = 100;
                            player.y = 350;
                            startTime = Date.now();
                        }
                        continue;
                    }

                    if (p.y > canvas.height || p.x < 0 || p.x > canvas.width) {
                        projectiles.splice(i, 1);
                    }
                }

                syncPositionToCloud();
            }

            function draw() {
                ctx.fillStyle = "#330000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let remainingSecs = Math.max(0, Math.ceil((survivalDuration - (Date.now() - startTime)) / 1000));

                // Draw Survival Timer & Health Bar UI
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(250, 15, 400, 30);
                ctx.strokeStyle = "#FF5555";
                ctx.strokeRect(250, 15, 400, 30);

                ctx.fillStyle = trialWon ? "#00FFCC" : "#FF5555";
                ctx.font = "14px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(trialWon ? "TRIAL COMPLETE: PROTOCOL UNLOCKED" : `SURVIVE TIME: ${remainingSecs}s // HP: ${player.hp}`, 450, 35);

                // Draw Core Boss Entity
                ctx.fillStyle = "#FF2222";
                ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
                ctx.strokeStyle = "#FFFFFF";
                ctx.strokeRect(boss.x, boss.y, boss.width, boss.height);

                // Draw Platforms
                ctx.fillStyle = "#FF5555";
                platforms.forEach(plat => {
                    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                });

                // Draw Projectiles
                ctx.fillStyle = "#FFAAAA";
                projectiles.forEach(p => {
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                });

                // Draw Peers
                for (const [peerName, pData] of Object.entries(peers)) {
                    ctx.fillStyle = pData.color || "#FF5555";
                    ctx.fillRect(pData.x, pData.y, 24, 36);

                    ctx.fillStyle = "#FF5555";
                    ctx.font = "10px 'Courier New'";
                    ctx.textAlign = "center";
                    ctx.fillText(`${peerName}`, pData.x + 12, pData.y - 6);
                }

                // Draw Local Player
                ctx.fillStyle = playerColor;
                ctx.fillRect(player.x, player.y, player.width, player.height);

                ctx.fillStyle = "#FF5555";
                ctx.font = "11px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(`${activeUser} (YOU)`, player.x + (player.width / 2), player.y - 8);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            loop();
        }
    </script>
</body>
</html>
