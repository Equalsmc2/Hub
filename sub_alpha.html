<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_HUB // SECTOR_ALPHA_BULLET_HELL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #550000;
            color: #FF5555;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 50px;
            overflow: hidden;
            user-select: none;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #FF5555;
            padding-bottom: 15px;
        }

        .system-title {
            font-size: 20px;
            font-weight: bold;
        }

        .user-hud {
            font-size: 16px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .color-indicator {
            width: 15px;
            height: 15px;
            display: inline-block;
            border: 1px solid #FF5555;
        }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 20px 0;
        }

        canvas {
            background-color: #220000;
            border: 4px solid #FF5555;
            box-shadow: 0 0 25px rgba(255,0,0,0.4);
            cursor: none;
        }

        .controls-hint {
            font-size: 14px;
            text-align: center;
            background: rgba(255, 0, 0, 0.1);
            padding: 10px;
            border: 1px solid rgba(255, 85, 85, 0.3);
        }

        .back-link {
            color: #FF5555;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .back-link:hover {
            color: #FFFFFF;
        }

        #loginGate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #550000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .portal-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #FF5555;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        input[type="text"] {
            background: transparent;
            border: 2px solid #FF5555;
            color: #FF5555;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
        }

        input::placeholder {
            color: rgba(255, 85, 85, 0.5);
        }

        button {
            background: #FF5555;
            color: #550000;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #FFFFFF;
        }

        .error-text {
            color: #FFAAAA;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- LOGIN GATE OVERLAY -->
    <div id="loginGate">
        <div class="portal-box">
            <div style="font-size: 24px; margin-bottom: 15px; color: #FF5555;">:(</div>
            <div style="font-size: 18px; margin-bottom: 20px; color: #FF5555;">[INITIALIZING BULLET HELL PROTOCOL]</div>
            <div style="font-size: 14px; margin-bottom: 10px; text-align: left; color: #FF5555;">ENTER AUTHORIZED SEEKER ID:</div>
            <input type="text" id="gateUsername" placeholder="e.g. Mneme_seeker">
            <button onclick="enterBulletHell()">ENGAGE PROTOCOL</button>
            <div id="gateError" class="error-text"></div>
        </div>
    </div>

    <!-- ROOM MAIN INTERFACE -->
    <div class="header-panel">
        <div class="system-title">CHAMBER_STATUS: SECTOR_ALPHA [BULLET HELL SURVIVAL - 60s]</div>
        <div class="user-hud">
            <span>SEEKER: <strong id="hudUser">---</strong></span>
            <span>TRAUMA SUIT: <strong id="hudSuit">---</strong></span>
            <span>COLOR CODE: <span class="color-indicator" id="hudColorBox"></span></span>
            <span class="back-link" onclick="returnToDoor3()">[RETURN TO DOOR 3]</span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="hubCanvas" width="900" height="450"></canvas>
    </div>

    <div class="controls-hint">
        CONTROLS: Use <strong>ARROW KEYS</strong> or <strong>W/A/S/D</strong> to freely dodge. Survive 60 seconds to manifest the exit gateway.
    </div>

    <!-- Firebase SDK & Multiplayer Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlgsx3uuat9oi2vwntXhInUcAe8N-veLY",
            authDomain: "enter-f1c88.firebaseapp.com",
            projectId: "enter-f1c88",
            storageBucket: "enter-f1c88.appspot.com",
            messagingSenderId: "794692963928",
            appId: "1:794692963928:web:83fed114aed9389bf3042d",
            measurementId: "G-PFGVSW5598"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const validUsers = [
            "Mneme_seeker", "Mirror_seeker", "Written_seeker", 
            "Faded_seeker", "Dule_Seeker", "Old_seeker", 
            "Strong_seeker", "Weaveshaper_seeker", "Fabled_seeker",
            "Prince_seeker"
        ];

        const seekerColors = {
            "Mneme_seeker": "#ff3366",
            "Mirror_seeker": "#33ffcc",
            "Written_seeker": "#ffcc00",
            "Faded_seeker": "#b8b8b8",
            "Dule_Seeker": "#ff6600",
            "Old_seeker": "#9933ff",
            "Strong_seeker": "#33cc33",
            "Weaveshaper_seeker": "#3399ff",
            "Fabled_seeker": "#ff33ff",
            "Prince_seeker": "#FFFF00"
        };

        let activeUser = "";
        let activeSuit = "Unallocated";
        let playerColor = "#FF5555";

        window.enterBulletHell = async function() {
            const inputVal = document.getElementById('gateUsername').value.trim();
            const errorDiv = document.getElementById('gateError');
            const matchedUser = validUsers.find(u => u.toLowerCase() === inputVal.toLowerCase());

            if (!matchedUser) {
                errorDiv.textContent = "ERROR 0x80070002: Unknown Seeker ID profile.";
                return;
            }

            activeUser = matchedUser;
            
            try {
                const docSnap = await getDoc(doc(db, "trauma_suits", "allocations"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    for (const [suit, user] of Object.entries(data)) {
                        if (user.toLowerCase() === activeUser.toLowerCase()) {
                            activeSuit = suit;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.error("Could not fetch suit data", e);
            }

            playerColor = seekerColors[activeUser] || "#FF5555";

            document.getElementById('hudUser').textContent = activeUser;
            document.getElementById('hudSuit').textContent = activeSuit;
            document.getElementById('hudColorBox').style.backgroundColor = playerColor;

            document.getElementById('loginGate').style.display = 'none';
            startBulletHellEngine();
        }

        window.returnToDoor3 = function() {
            window.location.href = "door3.html";
        }

        function startBulletHellEngine() {
            const canvas = document.getElementById('hubCanvas');
            const ctx = canvas.getContext('2d');

            let player = {
                x: 450,
                y: 350,
                radius: 8,
                speed: 5,
                hp: 100
            };

            let boss = {
                x: 450,
                y: 80,
                radius: 25,
                angle: 0,
                attackTimer: 0
            };

            let bullets = [];
            let startTime = Date.now();
            let survivalDuration = 60000; // 60 seconds
            let trialWon = false;
            let exitDoor = { x: 410, y: 180, w: 80, h: 90, active: false };

            const keys = {};

            window.addEventListener('keydown', (e) => {
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "KeyA", "KeyD", "KeyW", "KeyS"].includes(e.code)) {
                    e.preventDefault();
                }
                keys[e.code] = true;

                if (exitDoor.active && (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space')) {
                    if (
                        player.x > exitDoor.x && player.x < exitDoor.x + exitDoor.w &&
                        player.y > exitDoor.y && player.y < exitDoor.y + exitDoor.h
                    ) {
                        window.location.href = "victory_alpha.html";
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            let lastSync = 0;
            async function syncPositionToCloud(force = false) {
                const now = Date.now();
                if (force || now - lastSync > 100) {
                    lastSync = now;
                    try {
                        await setDoc(doc(db, "boss_alpha_players", activeUser), {
                            user: activeUser,
                            x: player.x,
                            y: player.y,
                            color: playerColor,
                            suit: activeSuit,
                            hp: player.hp,
                            lastUpdated: now
                        }, { merge: true });
                    } catch (e) {
                        console.error("Sync error:", e);
                    }
                }
            }

            let peers = {};
            onSnapshot(collection(db, "boss_alpha_players"), (snapshot) => {
                const now = Date.now();
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.user !== activeUser && docSnap.id !== activeUser) {
                        if (now - data.lastUpdated < 4000) {
                            peers[docSnap.id] = data;
                        } else {
                            delete peers[docSnap.id];
                        }
                    }
                });
            });

            function update() {
                let elapsedTime = Date.now() - startTime;
                if (elapsedTime >= survivalDuration) {
                    trialWon = true;
                    exitDoor.active = true;
                }

                // Free-roam 360 movement
                let dx = 0;
                let dy = 0;
                if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
                if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
                if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
                if (keys['ArrowDown'] || keys['KeyS']) dy += 1;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                player.x += dx * player.speed;
                player.y += dy * player.speed;

                // Canvas boundaries
                if (player.x < player.radius) player.x = player.radius;
                if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
                if (player.y < player.radius) player.y = player.radius;
                if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;

                if (!trialWon) {
                    // Intense Bullet Hell patterns
                    boss.angle += 0.08;
                    boss.attackTimer++;

                    // Pattern 1: Spiral Wave
                    if (boss.attackTimer % 3 === 0) {
                        let arms = 5;
                        for (let i = 0; i < arms; i++) {
                            let bulletAngle = boss.angle + (i * ((Math.PI * 2) / arms));
                            bullets.push({
                                x: boss.x,
                                y: boss.y,
                                vx: Math.cos(bulletAngle) * 4.5,
                                vy: Math.sin(bulletAngle) * 4.5,
                                radius: 5
                            });
                        }
                    }

                    // Pattern 2: Direct Sniper Bursts
                    if (boss.attackTimer % 45 === 0) {
                        let angleToPlayer = Math.atan2(player.y - boss.y, player.x - boss.x);
                        for (let offset = -0.3; offset <= 0.3; offset += 0.15) {
                            bullets.push({
                                x: boss.x,
                                y: boss.y,
                                vx: Math.cos(angleToPlayer + offset) * 6,
                                vy: Math.sin(angleToPlayer + offset) * 6,
                                radius: 6
                            });
                        }
                    }
                }

                // Update Bullets & Collisions
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    // Hitbox check with player core
                    let dist = Math.hypot(player.x - b.x, player.y - b.y);
                    if (dist < player.radius + b.radius) {
                        player.hp -= 20;
                        bullets.splice(i, 1);
                        if (player.hp <= 0) {
                            player.hp = 100;
                            player.x = 450;
                            player.y = 350;
                            startTime = Date.now(); // Penalty reset
                        }
                        continue;
                    }

                    // Out of bounds cleanup
                    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                        bullets.splice(i, 1);
                    }
                }

                syncPositionToCloud();
            }

            function draw() {
                ctx.fillStyle = "#220000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let remainingSecs = Math.max(0, Math.ceil((survivalDuration - (Date.now() - startTime)) / 1000));

                // Draw Exit Door if trial is won
                if (exitDoor.active) {
                    ctx.fillStyle = "rgba(0, 255, 204, 0.2)";
                    ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);
                    ctx.strokeStyle = "#00FFCC";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);

                    ctx.fillStyle = "#00FFCC";
                    ctx.font = "12px 'Courier New'";
                    ctx.textAlign = "center";
                    ctx.fillText("EXIT GATE", exitDoor.x + (exitDoor.w / 2), exitDoor.y - 10);
                }

                // Draw UI Status Bar
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(250, 15, 400, 30);
                ctx.strokeStyle = "#FF5555";
                ctx.lineWidth = 2;
                ctx.strokeRect(250, 15, 400, 30);

                ctx.fillStyle = trialWon ? "#00FFCC" : "#FF5555";
                ctx.font = "14px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(trialWon ? "GATEWAY UNLOCKED: ENTER TO PROCEED" : `SURVIVE: ${remainingSecs}s // HP: ${player.hp}`, 450, 35);

                // Draw Boss Core
                ctx.fillStyle = "#FF1111";
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#FFFFFF";
                ctx.stroke();

                // Draw Bullets
                ctx.fillStyle = "#FFAAAA";
                bullets.forEach(b => {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Draw Peers
                for (const [peerName, pData] of Object.entries(peers)) {
                    ctx.fillStyle = pData.color || "#FF5555";
                    ctx.beginPath();
                    ctx.arc(pData.x, pData.y, 8, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#FF5555";
                    ctx.font = "10px 'Courier New'";
                    ctx.textAlign = "center";
                    ctx.fillText(peerName, pData.x, pData.y - 12);
                }

                // Draw Local Player Hitbox Core
                ctx.fillStyle = playerColor;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#FFFFFF";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = "#FF5555";
                ctx.font = "11px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(`${activeUser} (YOU)`, player.x, player.y - 14);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            loop();
        }
    </script>
</body>
</html>
