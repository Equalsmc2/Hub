<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_HUB // ERROR_404_VOID // ECHO_DETECTED</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            overflow: hidden;
        }

        body {
            background-color: #050000;
            color: #FF3333;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        /* CRT Overlay */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 0, 0, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 100;
            pointer-events: none;
        }

        /* Fullscreen Canvas for Multiplayer Ghosts & Trails */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* The Corrupted 404 Console */
        .terminal-container {
            position: relative;
            z-index: 10;
            background: rgba(10, 0, 0, 0.85);
            border: 2px solid #FF0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4), inset 0 0 20px rgba(255, 0, 0, 0.2);
            width: 80%;
            max-width: 800px;
            height: 60vh;
            display: flex;
            flex-direction: column;
            padding: 2px;
            animation: terminalShake 0.1s infinite alternate;
        }

        @keyframes terminalShake {
            0% { transform: translate(1px, 0); }
            100% { transform: translate(-1px, 1px); }
        }

        .terminal-header {
            background: #FF0000;
            color: #000000;
            padding: 5px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            letter-spacing: 2px;
        }

        .terminal-body {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Hide scrollbar */
        .terminal-body::-webkit-scrollbar { display: none; }

        .error-code {
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            text-shadow: 4px 4px #000, -2px -2px #FF0055;
            animation: glitchText 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes glitchText {
            0%, 100% { transform: skew(0deg); }
            5%, 15% { transform: skew(10deg); filter: drop-shadow(-5px 0 0 cyan); }
            10%, 20% { transform: skew(-10deg); filter: drop-shadow(5px 0 0 red); }
            25%, 95% { transform: skew(0deg); filter: none; }
        }

        .log-line {
            font-size: 14px;
            line-height: 1.2;
            opacity: 0.8;
            word-wrap: break-word;
        }

        .log-highlight { color: #FFFFFF; font-weight: bold; background: #FF0000; padding: 0 5px; }

        .back-btn {
            background: transparent;
            color: #FF3333;
            border: 2px dashed #FF3333;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .back-btn:hover {
            background: #FF0000;
            color: #000000;
            box-shadow: 0 0 20px #FF0000;
        }

        /* Login Gate Overlay */
        #loginGate {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #110000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
        }

        .portal-box {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #FF0000;
            padding: 30px;
            max-width: 500px; width: 100%;
            text-align: center;
        }

        input[type="text"] {
            background: transparent;
            border: 1px solid #FF3333;
            color: #FF3333;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
        }

        .login-btn {
            background: #FF0000; color: #000; border: none; padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer;
        }
        .error-text { color: #FFAAAA; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="voidCanvas"></canvas>

    <!-- LOGIN GATE OVERLAY -->
    <div id="loginGate">
        <div class="portal-box">
            <div style="font-size: 32px; margin-bottom: 15px; color: #FF0000;">404</div>
            <div style="font-size: 18px; margin-bottom: 20px;">[SECTOR_ALPHA_GATEWAY_LOST]</div>
            <div style="font-size: 14px; margin-bottom: 10px; text-align: left;">IDENTIFY SIGNAL TO ENTER THE VOID:</div>
            <input type="text" id="gateUsername" placeholder="e.g. Mneme_seeker">
            <button class="login-btn" onclick="enterVoid()">BROADCAST SIGNAL</button>
            <div id="gateError" class="error-text"></div>
        </div>
    </div>

    <!-- MAIN TERMINAL -->
    <div class="terminal-container" id="terminal" style="display: none;">
        <div class="terminal-header">
            <span>KERNEL_PANIC // SECTOR_ALPHA</span>
            <span id="activeUserDisplay">USER: UNKNOWN</span>
        </div>
        <div class="terminal-body" id="logContainer">
            <div class="error-code">404</div>
            <div style="text-align: center; margin-bottom: 20px; color: #FFAAAA;">
                ROUTING INDEX DESTABILIZED. THE ICHOR STREAM HAS DISSOLVED THIS SECTOR.
            </div>
            <!-- Logs will spawn here -->
        </div>
        <button class="back-btn" onclick="window.location.href='index.html'">ABORT // RETURN TO HUB MAINFRAME</button>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBlgsx3uuat9oi2vwntXhInUcAe8N-veLY",
            authDomain: "enter-f1c88.firebaseapp.com",
            projectId: "enter-f1c88",
            storageBucket: "enter-f1c88.appspot.com",
            messagingSenderId: "794692963928",
            appId: "1:794692963928:web:83fed114aed9389bf3042d",
            measurementId: "G-PFGVSW5598"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const validUsers = [
            "Mneme_seeker", "Mirror_seeker", "Written_seeker", 
            "Faded_seeker", "Dule_Seeker", "Old_seeker", 
            "Strong_seeker", "Weaveshaper_seeker", "Fabled_seeker",
            "Prince_seeker"
        ];

        let activeUser = "";
        
        window.enterVoid = function() {
            const inputVal = document.getElementById('gateUsername').value.trim();
            const errorDiv = document.getElementById('gateError');
            const matchedUser = validUsers.find(u => u.toLowerCase() === inputVal.toLowerCase());

            if (!matchedUser) {
                errorDiv.textContent = "FATAL: Unrecognized Seeker ID. Cannot establish ghost connection.";
                return;
            }

            activeUser = matchedUser;
            document.getElementById('activeUserDisplay').textContent = `USER: ${activeUser}`;
            document.getElementById('loginGate').style.display = 'none';
            document.getElementById('terminal').style.display = 'flex';
            
            initMultiplayer();
            startKernelLogs();
        }

        // ==========================================
        // KERNEL PANIC LOG GENERATOR
        // ==========================================
        const logLines = [
            "Attempting to rebuild Alpha architecture... [FAILED]",
            "Warning: Ichor saturation at 114%. Hull breach imminent.",
            "Trauma Suit telemetry lost. Searching for biological feedback...",
            "Orphaned bullet entities detected in memory matrix.",
            "Sub-routing to Door 3... [CONNECTION TIMEOUT]",
            "ERROR 0x000000FE: Pointer refers to deleted human memory.",
            "Purging corrupted Opal data from cache...",
            "Listening for echoes of past Seekers in the void..."
        ];

        const logContainer = document.getElementById('logContainer');

        function startKernelLogs() {
            setInterval(() => {
                const el = document.createElement('div');
                el.className = 'log-line';
                
                // 10% chance for a severe highlight glitch
                if (Math.random() < 0.1) {
                    el.innerHTML = `[CRITICAL] <span class="log-highlight">SYSTEM DELETION AVOIDED</span>`;
                } else {
                    el.textContent = `> ${logLines[Math.floor(Math.random() * logLines.length)]} [${Date.now()}]`;
                }

                logContainer.insertBefore(el, logContainer.children[2]); // Insert below the 404 header
                
                // Keep DOM clean
                if (logContainer.children.length > 15) {
                    logContainer.removeChild(logContainer.lastChild);
                }
            }, 800);
        }

        // ==========================================
        // MULTIPLAYER GHOST CANVAS
        // ==========================================
        const canvas = document.getElementById('voidCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let mouseX = width / 2;
        let mouseY = height / 2;
        let otherPlayers = {}; 
        let mouseTrails = [];

        // Track local mouse
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Add to local trail
            mouseTrails.push({ x: mouseX, y: mouseY, alpha: 1 });
            if (mouseTrails.length > 20) mouseTrails.shift();
        });

        // Firebase Sync
        function initMultiplayer() {
            // 1. Listen for other players in the void
            onSnapshot(doc(db, "alpha_void", "ghosts"), (docSnap) => {
                if (docSnap.exists()) {
                    otherPlayers = docSnap.data();
                }
            });

            // 2. Broadcast local player position (throttled to save writes)
            setInterval(() => {
                if (!activeUser) return;
                
                // Normalize coordinates so they work across different screen resolutions
                const normX = mouseX / width;
                const normY = mouseY / height;

                setDoc(doc(db, "alpha_void", "ghosts"), {
                    [activeUser]: {
                        x: normX,
                        y: normY,
                        timestamp: Date.now()
                    }
                }, { merge: true });

            }, 150); // Broadcast every 150ms
        }

        // Render Loop
        function drawVoid() {
            // Clear with slight fade for trailing effects
            ctx.fillStyle = 'rgba(5, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Draw Local Mouse Trail (Digital tear effect)
            ctx.beginPath();
            for (let i = 0; i < mouseTrails.length; i++) {
                const pt = mouseTrails[i];
                ctx.strokeStyle = `rgba(255, 0, 0, ${pt.alpha})`;
                ctx.lineWidth = i * 0.5;
                if (i === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
                
                // Random glitch spike in the trail
                if (Math.random() > 0.8) {
                    ctx.lineTo(pt.x + (Math.random()-0.5)*50, pt.y + (Math.random()-0.5)*50);
                }
                
                pt.alpha -= 0.05;
            }
            ctx.stroke();

            // Render Multiplayer Ghosts
            const now = Date.now();
            for (const [user, data] of Object.entries(otherPlayers)) {
                if (user === activeUser) continue; // Don't draw self

                // Only draw players who updated within the last 5 seconds (active)
                if (now - data.timestamp < 5000) {
                    // Convert normalized coordinates back to screen space
                    const drawX = data.x * width;
                    const drawY = data.y * height;

                    // Draw the Ghost Orb
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, 8 + Math.random() * 4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 50, 50, ${0.5 + Math.random() * 0.5})`;
                    ctx.fill();

                    // Glitch box around them
                    if (Math.random() > 0.5) {
                        ctx.strokeStyle = '#FF0055';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(drawX - 15, drawY - 15, 30, 30);
                    }

                    // Draw Seeker ID Label
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = "12px 'Courier New'";
                    ctx.textAlign = 'center';
                    // Text flickers occasionally
                    if (Math.random() > 0.1) {
                        ctx.fillText(`[ECHO: ${user}]`, drawX, drawY - 20);
                    }
                }
            }

            requestAnimationFrame(drawVoid);
        }

        drawVoid();
    </script>
</body>
</html>
