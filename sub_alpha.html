<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_HUB // SECTOR_ALPHA_VIRUS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FFFF00;
            color: #000000;
            font-family: "Comic Sans MS", "Courier New", Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 50px;
            overflow: hidden;
            user-select: none;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px dashed #FF0000;
            padding-bottom: 15px;
            background-color: #000000;
            color: #FFFF00;
            padding: 10px 20px;
        }

        .system-title {
            font-size: 20px;
            font-weight: bold;
            animation: blinkTitle 0.5s infinite alternate;
        }

        @keyframes blinkTitle {
            0% { color: #FFFF00; }
            100% { color: #FF0000; }
        }

        .user-hud {
            font-size: 16px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .color-indicator {
            width: 15px;
            height: 15px;
            display: inline-block;
            border: 2px solid #FF0000;
        }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 20px 0;
        }

        canvas {
            background-color: #FFFFFF;
            border: 6px solid #FF0000;
            box-shadow: 0 0 30px rgba(255,0,0,0.8);
            cursor: none;
        }

        .controls-hint {
            font-size: 14px;
            text-align: center;
            background: #000000;
            color: #FFFF00;
            padding: 10px;
            border: 2px solid #FF0000;
            font-weight: bold;
        }

        .back-link {
            color: #FFFF00;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .back-link:hover {
            color: #FF0000;
        }

        #loginGate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #FFFF00;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .portal-box {
            background: #000000;
            border: 4px dashed #FF0000;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            color: #FFFF00;
        }

        input[type="text"] {
            background: #FFFF00;
            border: 3px solid #FF0000;
            color: #000000;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
            font-weight: bold;
        }

        input::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }

        button {
            background: #FF0000;
            color: #FFFF00;
            border: 2px solid #000000;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #FFFF00;
            color: #FF0000;
        }

        .error-text {
            color: #FF0000;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- LOGIN GATE OVERLAY -->
    <div id="loginGate">
        <div class="portal-box">
            <div style="font-size: 32px; margin-bottom: 15px; color: #FF0000; font-weight: bold;">YOU ARE AN IDIOT :)</div>
            <div style="font-size: 16px; margin-bottom: 20px; color: #FFFF00;">[SECTOR ALPHA INFESTATION PROTOCOL]</div>
            <div style="font-size: 14px; margin-bottom: 10px; text-align: left; color: #FFFF00;">ENTER AUTHORIZED SEEKER ID:</div>
            <input type="text" id="gateUsername" placeholder="e.g. Mneme_seeker">
            <button onclick="enterVirusHell()">INFEST</button>
            <div id="gateError" class="error-text"></div>
        </div>
    </div>

    <!-- ROOM MAIN INTERFACE -->
    <div class="header-panel">
        <div class="system-title">HA! HA! HA! YOU ARE AN IDIOT // SURVIVE 30s</div>
        <div class="user-hud">
            <span>SEEKER: <strong id="hudUser">---</strong></span>
            <span>TRAUMA SUIT: <strong id="hudSuit">---</strong></span>
            <span>COLOR CODE: <span class="color-indicator" id="hudColorBox"></span></span>
            <span class="back-link" onclick="returnToDoor3()">[RETURN TO DOOR 3]</span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="hubCanvas" width="900" height="450"></canvas>
    </div>

    <div class="controls-hint">
        CONTROLS: Use <strong>ARROW KEYS</strong> or <strong>W/A/S/D</strong> to dodge the bouncing idiot smileys for <strong>30 seconds</strong>!
    </div>

    <!-- Firebase SDK & Multiplayer Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlgsx3uuat9oi2vwntXhInUcAe8N-veLY",
            authDomain: "enter-f1c88.firebaseapp.com",
            projectId: "enter-f1c88",
            storageBucket: "enter-f1c88.appspot.com",
            messagingSenderId: "794692963928",
            appId: "1:794692963928:web:83fed114aed9389bf3042d",
            measurementId: "G-PFGVSW5598"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const validUsers = [
            "Mneme_seeker", "Mirror_seeker", "Written_seeker", 
            "Faded_seeker", "Dule_Seeker", "Old_seeker", 
            "Strong_seeker", "Weaveshaper_seeker", "Fabled_seeker",
            "Prince_seeker"
        ];

        const seekerColors = {
            "Mneme_seeker": "#ff3366",
            "Mirror_seeker": "#33ffcc",
            "Written_seeker": "#ffcc00",
            "Faded_seeker": "#b8b8b8",
            "Dule_Seeker": "#ff6600",
            "Old_seeker": "#9933ff",
            "Strong_seeker": "#33cc33",
            "Weaveshaper_seeker": "#3399ff",
            "Fabled_seeker": "#ff33ff",
            "Prince_seeker": "#FFFF00"
        };

        let activeUser = "";
        let activeSuit = "Unallocated";
        let playerColor = "#FF5555";

        window.enterVirusHell = async function() {
            const inputVal = document.getElementById('gateUsername').value.trim();
            const errorDiv = document.getElementById('gateError');
            const matchedUser = validUsers.find(u => u.toLowerCase() === inputVal.toLowerCase());

            if (!matchedUser) {
                errorDiv.textContent = "ERROR: Unknown Seeker ID profile.";
                return;
            }

            activeUser = matchedUser;
            
            try {
                const docSnap = await getDoc(doc(db, "trauma_suits", "allocations"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    for (const [suit, user] of Object.entries(data)) {
                        if (user.toLowerCase() === activeUser.toLowerCase()) {
                            activeSuit = suit;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.error("Could not fetch suit data", e);
            }

            playerColor = seekerColors[activeUser] || "#FF0000";

            document.getElementById('hudUser').textContent = activeUser;
            document.getElementById('hudSuit').textContent = activeSuit;
            document.getElementById('hudColorBox').style.backgroundColor = playerColor;

            document.getElementById('loginGate').style.display = 'none';
            startVirusEngine();
        }

        window.returnToDoor3 = function() {
            window.location.href = "door3.html";
        }

        function startVirusEngine() {
            const canvas = document.getElementById('hubCanvas');
            const ctx = canvas.getContext('2d');

            let player = {
                x: 450,
                y: 225,
                radius: 12,
                speed: 4.5,
                hp: 100
            };

            // Simpler, easier hazard projectiles inspired by the classic virus bouncing smileys
            let bullets = [
                { x: 100, y: 100, vx: 2.5, vy: 2.0, radius: 18 },
                { x: 800, y: 100, vx: -2.2, vy: 2.5, radius: 18 },
                { x: 450, y: 350, vx: 2.0, vy: -2.3, radius: 18 },
                { x: 200, y: 300, vx: -2.5, vy: -2.0, radius: 18 }
            ];

            let startTime = Date.now();
            let survivalDuration = 30000; // 30 seconds (easier)
            let trialWon = false;
            let exitDoor = { x: 405, y: 175, w: 90, h: 100, active: false };

            const keys = {};

            window.addEventListener('keydown', (e) => {
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "KeyA", "KeyD", "KeyW", "KeyS"].includes(e.code)) {
                    e.preventDefault();
                }
                keys[e.code] = true;

                if (exitDoor.active && (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space')) {
                    if (
                        player.x > exitDoor.x && player.x < exitDoor.x + exitDoor.w &&
                        player.y > exitDoor.y && player.y < exitDoor.y + exitDoor.h
                    ) {
                        window.location.href = "victory_alpha.html";
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            let lastSync = 0;
            async function syncPositionToCloud(force = false) {
                const now = Date.now();
                if (force || now - lastSync > 100) {
                    lastSync = now;
                    try {
                        await setDoc(doc(db, "boss_alpha_players", activeUser), {
                            user: activeUser,
                            x: player.x,
                            y: player.y,
                            color: playerColor,
                            suit: activeSuit,
                            hp: player.hp,
                            lastUpdated: now
                        }, { merge: true });
                    } catch (e) {
                        console.error("Sync error:", e);
                    }
                }
            }

            let peers = {};
            onSnapshot(collection(db, "boss_alpha_players"), (snapshot) => {
                const now = Date.now();
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.user !== activeUser && docSnap.id !== activeUser) {
                        if (now - data.lastUpdated < 4000) {
                            peers[docSnap.id] = data;
                        } else {
                            delete peers[docSnap.id];
                        }
                    }
                });
            });

            function update() {
                let elapsedTime = Date.now() - startTime;
                if (elapsedTime >= survivalDuration) {
                    trialWon = true;
                    exitDoor.active = true;
                }

                let dx = 0;
                let dy = 0;
                if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
                if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
                if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
                if (keys['ArrowDown'] || keys['KeyS']) dy += 1;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                player.x += dx * player.speed;
                player.y += dy * player.speed;

                if (player.x < player.radius) player.x = player.radius;
                if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
                if (player.y < player.radius) player.y = player.radius;
                if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;

                // Bouncing virus smileys wall collision logic
                bullets.forEach(b => {
                    b.x += b.vx;
                    b.y += b.vy;

                    if (b.x - b.radius < 0 || b.x + b.radius > canvas.width) {
                        b.vx *= -1;
                    }
                    if (b.y - b.radius < 0 || b.y + b.radius > canvas.height) {
                        b.vy *= -1;
                    }

                    // Collision check with player
                    let dist = Math.hypot(player.x - b.x, player.y - b.y);
                    if (dist < player.radius + b.radius) {
                        player.hp -= 15;
                        if (player.hp <= 0) {
                            player.hp = 100;
                            player.x = 450;
                            player.y = 225;
                            startTime = Date.now();
                        }
                    }
                });

                syncPositionToCloud();
            }

            function draw() {
                // Flashing aesthetic background effect
                ctx.fillStyle = Math.floor(Date.now() / 200) % 2 === 0 ? "#FFFF00" : "#FF0000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let remainingSecs = Math.max(0, Math.ceil((survivalDuration - (Date.now() - startTime)) / 1000));

                // Draw Exit Door if trial is won
                if (exitDoor.active) {
                    ctx.fillStyle = "#00FF00";
                    ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);
                    ctx.strokeStyle = "#000000";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);

                    ctx.fillStyle = "#000000";
                    ctx.font = "bold 14px 'Comic Sans MS'";
                    ctx.textAlign = "center";
                    ctx.fillText("EXIT DOOR!", exitDoor.x + (exitDoor.w / 2), exitDoor.y - 12);
                }

                // Draw UI Status Box
                ctx.fillStyle = "#000000";
                ctx.fillRect(250, 15, 400, 30);
                ctx.strokeStyle = "#FFFF00";
                ctx.lineWidth = 3;
                ctx.strokeRect(250, 15, 400, 30);

                ctx.fillStyle = trialWon ? "#00FF00" : "#FFFF00";
                ctx.font = "bold 14px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(trialWon ? "YOU ARE NOT AN IDIOT! ENTER DOOR" : `SURVIVE: ${remainingSecs}s // HP: ${player.hp}`, 450, 35);

                // Draw Virus Smileys (You Are An Idiot Style Faces)
                bullets.forEach(b => {
                    ctx.fillStyle = "#FFFFFF";
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#000000";
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Smiley eyes & grin
                    ctx.fillStyle = "#000000";
                    ctx.fillRect(b.x - 6, b.y - 6, 4, 4);
                    ctx.fillRect(b.x + 2, b.y - 6, 4, 4);
                    ctx.beginPath();
                    ctx.arc(b.x, b.y + 3, 6, 0, Math.PI);
                    ctx.stroke();
                });

                // Draw Peers
                for (const [peerName, pData] of Object.entries(peers)) {
                    ctx.fillStyle = pData.color || "#000000";
                    ctx.beginPath();
                    ctx.arc(pData.x, pData.y, 10, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#000000";
                    ctx.font = "bold 10px 'Courier New'";
                    ctx.textAlign = "center";
                    ctx.fillText(peerName, pData.x, pData.y - 14);
                }

                // Draw Local Player
                ctx.fillStyle = playerColor;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = "#000000";
                ctx.font = "bold 11px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(`${activeUser}`, player.x, player.y - 16);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            loop();
        }
    </script>
</body>
</html>
