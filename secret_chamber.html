<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_HUB // SECRET_CHAMBER // CONTAINMENT_BREACH</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            overflow: hidden;
        }

        body {
            background-color: #050505;
            color: #FF3333;
            font-family: 'Courier New', Courier, monospace;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT Effects */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            background-size: 100% 4px, 3px 100%;
            z-index: 100;
            pointer-events: none;
        }

        /* =========================================
           LOGIN GATE
           ========================================= */
        #loginGate {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0e0000;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .portal-box {
            background: #000; border: 2px solid #FF0000; padding: 35px; width: 450px; text-align: center;
            box-shadow: 0 0 30px rgba(255,0,0,0.5);
        }
        input[type="text"] {
            background: transparent; border: 1px solid #FF3333; color: #FF3333; padding: 10px;
            font-family: 'Courier New', Courier, monospace; font-size: 16px; width: 100%; outline: none; margin-bottom: 15px;
            text-align: center;
        }
        .btn {
            background: #FF0000; color: #000; border: none; padding: 10px 20px; font-weight: bold;
            font-family: 'Courier New', Courier, monospace; cursor: pointer; width: 100%; text-transform: uppercase;
        }
        .btn:hover { background: #FFFFFF; box-shadow: 0 0 15px #FF0000; }
        .error-text { color: #FF8888; margin-top: 10px; font-size: 13px; }

        /* =========================================
           LOBBY STATE
           ========================================= */
        #lobbyState {
            display: none; 
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            background: rgba(10, 0, 0, 0.9);
            border: 2px solid #FF0000;
            padding: 40px;
            width: 600px;
            height: 500px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            z-index: 10;
        }

        .lobby-title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px solid #FF3333;
            width: 100%;
            padding-bottom: 10px;
        }

        .seeker-list {
            flex-grow: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .seeker-entry {
            font-size: 16px;
            color: #00FFCC;
            opacity: 0;
            animation: fadeIn 0.2s forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .lobby-status {
            font-size: 18px;
            color: #FFF;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse { to { opacity: 0.5; } }

        /* =========================================
           GAME STATE (The Maze)
           ========================================= */
        #gameState {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
        }

        canvas {
            display: block;
            margin: 0 auto;
            image-rendering: pixelated;
        }

        #glitchOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 0, 85, 0.1),
                rgba(255, 0, 85, 0.1) 2px,
                transparent 2px,
                transparent 4px
            );
            mix-blend-mode: screen;
            transition: opacity 0.1s;
        }

        /* =========================================
           JUMP SCARE STATE
           ========================================= */
        #scareState {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .scare-face-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            animation: franticShake 0.05s infinite;
        }

        .scare-eye {
            position: absolute; top: 30%; width: 15vw; height: 15vw; background: #000;
            border: 10px solid #FF0000; border-radius: 50%; box-shadow: 0 0 100px #FF0000, inset 0 0 50px #FFF;
            display: flex; justify-content: center; align-items: center;
        }
        .scare-eye.left { left: 20%; }
        .scare-eye.right { right: 20%; }

        .scare-pupil {
            width: 3vw; height: 3vw; background: #FFF; border-radius: 50%;
            animation: franticPupil 0.1s infinite alternate;
        }

        .scare-mouth {
            position: absolute; top: 65%; left: 20%; width: 60%; height: 20vh; background: #000;
            border: 8px solid #FF0000; border-radius: 10px 10px 150px 150px; box-shadow: 0 0 100px #FF0000; overflow: hidden;
        }

        .scare-teeth {
            width: 100%; height: 100%; background: repeating-linear-gradient(90deg, #FFF, #FFF 20px, #000 20px, #000 30px);
            animation: teethChatter 0.05s infinite;
        }

        @keyframes franticShake {
            0% { transform: translate(10px, 10px) scale(1.1); filter: invert(0%) hue-rotate(0deg); }
            50% { transform: translate(-15px, -5px) scale(1.2); filter: invert(100%) hue-rotate(90deg); }
            100% { transform: translate(5px, -15px) scale(1.05); filter: invert(0%) hue-rotate(0deg); }
        }
        @keyframes franticPupil { 0% { transform: translate(-10px, -10px) scale(1); } 100% { transform: translate(10px, 10px) scale(2); } }
        @keyframes teethChatter { 0% { transform: translateY(0); } 100% { transform: translateY(10px); } }

    </style>
</head>
<body>

    <div class="scanlines"></div>

    <!-- ENTRY MATRIX -->
    <div id="loginGate">
        <div class="portal-box">
            <div style="font-size: 28px; margin-bottom: 10px; color: #FF0000; font-weight: bold;">SECRET_CHAMBER</div>
            <div style="font-size: 13px; margin-bottom: 25px; color: #FFAAAA;">INITIALIZE SEEKER LINK</div>
            <input type="text" id="gateUsername" placeholder="e.g. Old_seeker" autocomplete="off">
            <button class="btn" onclick="enterLobby()">CONNECT TO NODE</button>
            <div id="gateError" class="error-text"></div>
        </div>
    </div>

    <!-- LOBBY -->
    <div id="lobbyState">
        <div class="lobby-title">NODE 404 // AWAITING 10 SEEKERS</div>
        <div class="seeker-list" id="seekerList"></div>
        <div class="lobby-status" id="lobbyStatus">CONNECTING TO HUB MAINFRAME...</div>
    </div>

    <!-- THE MAZE -->
    <div id="gameState">
        <div id="glitchOverlay"></div>
        <canvas id="mazeCanvas"></canvas>
    </div>

    <!-- THE SCARE -->
    <div id="scareState">
        <div class="scare-face-container">
            <div class="scare-eye left"><div class="scare-pupil"></div></div>
            <div class="scare-eye right"><div class="scare-pupil"></div></div>
            <div class="scare-mouth"><div class="scare-teeth"></div></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlgsx3uuat9oi2vwntXhInUcAe8N-veLY",
            authDomain: "enter-f1c88.firebaseapp.com",
            projectId: "enter-f1c88",
            storageBucket: "enter-f1c88.appspot.com",
            messagingSenderId: "794692963928",
            appId: "1:794692963928:web:83fed114aed9389bf3042d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const validUsers = ["Mneme_seeker", "Mirror_seeker", "Written_seeker", "Faded_seeker", "Dule_Seeker", "Old_seeker", "Strong_seeker", "Weaveshaper_seeker", "Fabled_seeker", "Prince_seeker"];
        
        let activeUser = "";
        let inLobby = false;
        let inGame = false;
        let otherPlayers = {}; // Multiplayer data from Firebase
        
        const keysPressed = {};
        let heartbeatInterval;
        let syncInterval;

        // =========================================
        // MULTIPLAYER LOGIN & LOBBY LOGIC
        // =========================================
        window.enterLobby = function() {
            const inputVal = document.getElementById('gateUsername').value.trim();
            const errorDiv = document.getElementById('gateError');
            const matchedUser = validUsers.find(u => u.toLowerCase() === inputVal.toLowerCase());

            if (!matchedUser) {
                errorDiv.textContent = "ACCESS DENIED: Unrecognized Seeker ID.";
                return;
            }

            activeUser = matchedUser;
            document.getElementById('loginGate').style.display = 'none';
            document.getElementById('lobbyState').style.display = 'flex';
            inLobby = true;
            
            initMultiplayerLobby();
        }

        document.getElementById('gateUsername').addEventListener('keydown', function(e) {
            if(e.key === 'Enter') window.enterLobby();
        });

        function initMultiplayerLobby() {
            // Write to lobby heartbeat every 2.5 seconds
            heartbeatInterval = setInterval(() => {
                if(inLobby) {
                    setDoc(doc(db, "secret_chamber", "lobby"), {
                        [activeUser]: Date.now()
                    }, { merge: true });
                }
            }, 2500);

            // Listen for other real players in the lobby
            onSnapshot(doc(db, "secret_chamber", "lobby"), (docSnap) => {
                if (!inLobby) return;
                
                const seekerListEl = document.getElementById('seekerList');
                const lobbyStatus = document.getElementById('lobbyStatus');
                seekerListEl.innerHTML = ""; // clear list

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const now = Date.now();
                    let activeCount = 0;

                    for (const [user, timestamp] of Object.entries(data)) {
                        // Only count users who sent a heartbeat in the last 10 seconds
                        if (now - timestamp < 10000) {
                            activeCount++;
                            const el = document.createElement('div');
                            el.className = 'seeker-entry';
                            if (user === activeUser) {
                                el.innerHTML = `> ${user} [LOCAL_USER] connected.`;
                                el.style.color = '#FFF';
                            } else {
                                el.innerHTML = `> ${user} joined the instance.`;
                            }
                            seekerListEl.appendChild(el);
                        }
                    }

                    lobbyStatus.textContent = `AWAITING SEEKERS... ${activeCount}/10`;

                    // Start game if 10 real players connect
                    if (activeCount >= 10 && !inGame) {
                        lobbyStatus.textContent = "CAPACITY REACHED. INITIATING CONTAINMENT BREACH...";
                        lobbyStatus.style.color = "#FF0000";
                        setTimeout(initGame, 2000);
                    }
                }
            });
        }

        // CHEAT CODE OVERRIDE
        window.addEventListener('keydown', (e) => {
            keysPressed[e.key.toLowerCase()] = true;
            if (keysPressed['shift'] && (keysPressed['9'] || keysPressed['(']) && (keysPressed['0'] || keysPressed[')'])) {
                if (inLobby && !inGame) initGame(); // Force start early
            }
        });
        window.addEventListener('keyup', (e) => keysPressed[e.key.toLowerCase()] = false);

        // =========================================
        // DETERMINISTIC MAZE GENERATOR
        // =========================================
        // Seeded RNG so all players generate the EXACT same maze on their machines
        let seed = 1337404; 
        function seededRandom() {
            let t = seed += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }

        const COLS = 51; 
        const ROWS = 51; 
        const TILE_SIZE = 40;
        let mazeGrid = [];

        function generateMaze() {
            for (let y = 0; y < ROWS; y++) {
                mazeGrid[y] = [];
                for (let x = 0; x < COLS; x++) {
                    mazeGrid[y][x] = 1;
                }
            }

            function carve(cx, cy) {
                const dirs = [ [0, -2], [0, 2], [-2, 0], [2, 0] ];
                
                // Shuffle using seeded random
                for (let i = dirs.length - 1; i > 0; i--) {
                    const j = Math.floor(seededRandom() * (i + 1));
                    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
                }

                for (let i = 0; i < dirs.length; i++) {
                    const nx = cx + dirs[i][0];
                    const ny = cy + dirs[i][1];

                    if (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && mazeGrid[ny][nx] === 1) {
                        mazeGrid[cy + dirs[i][1] / 2][cx + dirs[i][0] / 2] = 0;
                        mazeGrid[ny][nx] = 0;
                        carve(nx, ny);
                    }
                }
            }

            mazeGrid[1][1] = 0;
            carve(1, 1);
            mazeGrid[ROWS - 2][COLS - 2] = 2; // Exit
        }

        // =========================================
        // MULTIPLAYER GAME ENGINE
        // =========================================
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        let gameLoop;
        let frameCount = 0;
        
        const player = { x: 1.5 * TILE_SIZE, y: 1.5 * TILE_SIZE, radius: 10, speed: 4 };
        const nextbot = { x: (COLS - 1.5) * TILE_SIZE, y: (ROWS - 1.5) * TILE_SIZE, radius: 15, speed: 4.8 };
        let nextbotPath = [];
        
        let camera = { x: 0, y: 0 };

        function initGame() {
            inLobby = false;
            inGame = true;
            clearInterval(heartbeatInterval);

            document.getElementById('lobbyState').style.display = 'none';
            document.getElementById('gameState').style.display = 'block';
            
            generateMaze();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            initMultiplayerGameSync();

            gameLoop = requestAnimationFrame(update);
        }

        function initMultiplayerGameSync() {
            // Listen for other real players moving in the maze
            onSnapshot(doc(db, "secret_chamber", "players"), (docSnap) => {
                if (docSnap.exists()) {
                    otherPlayers = docSnap.data();
                }
            });

            // Broadcast your position to the maze every 150ms
            syncInterval = setInterval(() => {
                if (inGame && activeUser) {
                    setDoc(doc(db, "secret_chamber", "players"), {
                        [activeUser]: {
                            x: player.x,
                            y: player.y,
                            timestamp: Date.now()
                        }
                    }, { merge: true });
                }
            }, 150);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // =========================================
        // COLLISION & NEXTBOT LOGIC
        // =========================================
        function isWall(x, y, radius) {
            const corners = [
                { cx: x - radius, cy: y - radius }, { cx: x + radius, cy: y - radius },
                { cx: x - radius, cy: y + radius }, { cx: x + radius, cy: y + radius }
            ];
            for (let c of corners) {
                const gridX = Math.floor(c.cx / TILE_SIZE);
                const gridY = Math.floor(c.cy / TILE_SIZE);
                if (gridY < 0 || gridY >= ROWS || gridX < 0 || gridX >= COLS) return true;
                if (mazeGrid[gridY][gridX] === 1) return true;
                if (mazeGrid[gridY][gridX] === 2) {
                    alert("SECTOR BREACHED. ESCAPE SUCCESSFUL.");
                    window.location.href = 'index.html';
                    return false;
                }
            }
            return false;
        }

        function getPathToClosestPlayer(startX, startY) {
            // Targets include you + all synced real players active in the last 3 seconds
            let targets = [{ x: player.x, y: player.y }];
            const now = Date.now();
            
            for (const [user, data] of Object.entries(otherPlayers)) {
                if (user !== activeUser && now - data.timestamp < 3000) {
                    targets.push({ x: data.x, y: data.y });
                }
            }
            
            let targetGrids = targets.map(t => ({x: Math.floor(t.x/TILE_SIZE), y: Math.floor(t.y/TILE_SIZE)}));

            let queue = [{x: startX, y: startY, path: []}];
            let visited = new Set();
            visited.add(`${startX},${startY}`);

            while(queue.length > 0) {
                let curr = queue.shift();
                
                for(let tg of targetGrids) {
                    if(tg.x === curr.x && tg.y === curr.y) return curr.path;
                }
                
                const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                for(let d of dirs) {
                    let nx = curr.x + d[0], ny = curr.y + d[1];
                    if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && mazeGrid[ny][nx] !== 1 && !visited.has(`${nx},${ny}`)) {
                        visited.add(`${nx},${ny}`);
                        queue.push({x: nx, y: ny, path: [...curr.path, {x: nx, y: ny}]});
                    }
                }
            }
            return [];
        }

        function updateNextbot() {
            let gridX = Math.floor(nextbot.x / TILE_SIZE);
            let gridY = Math.floor(nextbot.y / TILE_SIZE);

            if (frameCount % 15 === 0 || nextbotPath.length === 0) {
                nextbotPath = getPathToClosestPlayer(gridX, gridY);
            }

            if (nextbotPath.length > 0) {
                let targetGrid = nextbotPath[0];
                let targetPixelX = targetGrid.x * TILE_SIZE + TILE_SIZE / 2;
                let targetPixelY = targetGrid.y * TILE_SIZE + TILE_SIZE / 2;
                
                let dx = targetPixelX - nextbot.x;
                let dy = targetPixelY - nextbot.y;
                let dist = Math.hypot(dx, dy);
                
                if (dist < nextbot.speed) {
                    nextbot.x = targetPixelX;
                    nextbot.y = targetPixelY;
                    nextbotPath.shift(); 
                } else {
                    nextbot.x += (dx / dist) * nextbot.speed;
                    nextbot.y += (dy / dist) * nextbot.speed;
                }
            }
        }

        // =========================================
        // RENDERING & LOOP
        // =========================================
        function update() {
            frameCount++;

            let vx = 0, vy = 0;
            if (keysPressed['w'] || keysPressed['arrowup']) vy -= player.speed;
            if (keysPressed['s'] || keysPressed['arrowdown']) vy += player.speed;
            if (keysPressed['a'] || keysPressed['arrowleft']) vx -= player.speed;
            if (keysPressed['d'] || keysPressed['arrowright']) vx += player.speed;

            if (vx !== 0 && vy !== 0) { vx *= 0.707; vy *= 0.707; }

            if (!isWall(player.x + vx, player.y, player.radius)) player.x += vx;
            if (!isWall(player.x, player.y + vy, player.radius)) player.y += vy;

            updateNextbot();

            const distToBot = Math.hypot(player.x - nextbot.x, player.y - nextbot.y);
            // Only jump scare if Nextbot hits YOU locally
            if (distToBot < player.radius + nextbot.radius) {
                triggerJumpscare();
                return;
            }

            const glitchOverlay = document.getElementById('glitchOverlay');
            if (distToBot < 350) {
                const intensity = 1 - (distToBot / 350);
                glitchOverlay.style.opacity = intensity * 0.9;
                camera.x = (Math.random() - 0.5) * (intensity * 25);
                camera.y = (Math.random() - 0.5) * (intensity * 25);
            } else {
                glitchOverlay.style.opacity = 0;
                camera.x = 0; camera.y = 0;
            }

            draw();
            gameLoop = requestAnimationFrame(update);
        }

        function drawNextbot(cx, cy) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((Math.random() - 0.5) * 0.5);
            ctx.scale(1 + Math.random()*0.2, 1 + Math.random()*0.2);

            ctx.fillStyle = '#000';
            ctx.fillRect(-20, -20, 40, 40);
            
            ctx.fillStyle = '#F00';
            ctx.beginPath(); ctx.arc(-8, -5, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, -5, 6, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#FFF';
            ctx.beginPath(); ctx.arc(-8, -5, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, -5, 2, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#FFF';
            ctx.fillRect(-10, 10, 20, 5);
            if(Math.random() > 0.5) { ctx.fillStyle = '#F00'; ctx.fillRect(-12, 8, 24, 2); }

            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const offsetX = (canvas.width / 2) - player.x + camera.x;
            const offsetY = (canvas.height / 2) - player.y + camera.y;

            ctx.save();
            ctx.translate(offsetX, offsetY);

            // Draw identical maze structure
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (mazeGrid[y][x] === 1) {
                        ctx.fillStyle = '#111'; 
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE + 1, TILE_SIZE + 1);
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    } else if (mazeGrid[y][x] === 2) {
                        ctx.fillStyle = '#00FF00'; 
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // Draw MULTIPLAYER GHOSTS (Other Real Users)
            const now = Date.now();
            for (const [user, data] of Object.entries(otherPlayers)) {
                if (user !== activeUser && now - data.timestamp < 3000) {
                    ctx.fillStyle = '#3399FF';
                    ctx.beginPath();
                    ctx.arc(data.x, data.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#FFF';
                    ctx.font = '10px Courier New';
                    ctx.fillText(user, data.x - (ctx.measureText(user).width / 2), data.y - 15);
                }
            }

            // Draw Local Player
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 15; ctx.shadowColor = '#FFFFFF';
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#FFF';
            ctx.font = '10px Courier New';
            ctx.fillText(`${activeUser} (YOU)`, player.x - (ctx.measureText(`${activeUser} (YOU)`).width / 2), player.y - 15);

            // Draw Nextbot
            ctx.shadowBlur = 0;
            drawNextbot(nextbot.x, nextbot.y);

            ctx.restore();

            // Flashlight Mask
            ctx.globalCompositeOperation = 'source-over';
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 60, 
                canvas.width / 2, canvas.height / 2, 280
            );
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            gradient.addColorStop(1, 'rgba(0,0,0,0.98)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function triggerJumpscare() {
            inGame = false;
            clearInterval(syncInterval);
            cancelAnimationFrame(gameLoop);
            
            document.getElementById('gameState').style.display = 'none';
            document.getElementById('scareState').style.display = 'flex';
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

    </script>
</body>
</html>
