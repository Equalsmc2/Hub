<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_HUB // DOOR_2_AUTHENTICATION</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0078D7;
            color: #FFFFFF;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 50px;
            overflow: hidden;
            user-select: none;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #FFFFFF;
            padding-bottom: 15px;
        }

        .system-title {
            font-size: 20px;
            font-weight: bold;
        }

        .user-hud {
            font-size: 16px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .color-indicator {
            width: 15px;
            height: 15px;
            display: inline-block;
            border: 1px solid #FFFFFF;
        }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 20px 0;
        }

        canvas {
            background-color: #00458a;
            border: 4px solid #FFFFFF;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .controls-hint {
            font-size: 14px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .back-link {
            color: #FFFFFF;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .back-link:hover {
            color: #d1e7ff;
        }

        #authGate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0078D7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .portal-box {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed #FFFFFF;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        input[type="text"], input[type="password"] {
            background: transparent;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        button {
            background: #FFFFFF;
            color: #0078D7;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #e0e0e0;
        }

        .error-text {
            color: #ffcccc;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION GATE OVERLAY -->
    <div id="authGate">
        <div class="portal-box">
            <div style="font-size: 24px; margin-bottom: 15px;">:(</div>
            <div style="font-size: 18px; margin-bottom: 20px;">[SECURITY EXCEPTION: DOOR 2 LOCKED]</div>
            <div style="font-size: 14px; margin-bottom: 10px; text-align: left;">ENTER KERNEL PASSWORD:</div>
            <input type="password" id="gatePassword" placeholder="Enter password...">
            <button onclick="verifyPassword()">AUTHENTICATE</button>
            <div id="gateError" class="error-text"></div>
        </div>
    </div>

    <!-- ROOM MAIN INTERFACE -->
    <div class="header-panel">
        <div class="system-title">CHAMBER_STATUS: DOOR_2 [MULTI-BRANCH ZONE]</div>
        <div class="user-hud">
            <span>SECURITY LEVEL: <strong style="color: #00ffcc;">VERIFIED</strong></span>
            <span class="back-link" onclick="returnToHub()">[RETURN TO HUB]</span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="hubCanvas" width="800" height="450"></canvas>
    </div>

    <div class="controls-hint">
        CONTROLS: Use <strong>A / D</strong> or <strong>LEFT / RIGHT</strong> to move, <strong>W / SPACE / UP</strong> to jump. Navigate to either Branch Door and press <strong>UP</strong> to enter.
    </div>

    <script>
        window.verifyPassword = function() {
            const passVal = document.getElementById('gatePassword').value;
            const errorDiv = document.getElementById('gateError');

            if (passVal === "HelloWorld") {
                document.getElementById('authGate').style.display = 'none';
                startPlatformerEngine();
            } else {
                errorDiv.textContent = "ERROR 0x80070005: Access Denied. Invalid Password.";
            }
        }

        window.returnToHub = function() {
            window.location.href = "index.html";
        }

        function startPlatformerEngine() {
            const canvas = document.getElementById('hubCanvas');
            const ctx = canvas.getContext('2d');

            let player = {
                x: 380,
                y: 350,
                width: 24,
                height: 36,
                vx: 0,
                vy: 0,
                speed: 4,
                jumpForce: -10,
                grounded: false
            };

            const platforms = [
                { x: 0, y: 410, w: 800, h: 40 },   // Main Floor
                { x: 100, y: 300, w: 200, h: 20 },  // Left Ledge
                { x: 500, y: 300, w: 200, h: 20 }   // Right Ledge
            ];

            // Two branch doors positioned on the left and right ledges
            const doors = [
                { x: 175, y: 200, w: 50, h: 100, label: "BRANCH_A", url: "branch_a.html" },
                { x: 575, y: 200, w: 50, h: 100, label: "BRANCH_B", url: "branch_b.html" }
            ];

            const gravity = 0.5;
            const keys = {};

            window.addEventListener('keydown', (e) => {
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space", "KeyA", "KeyD", "KeyW"].includes(e.code)) {
                    e.preventDefault();
                }
                keys[e.code] = true;

                // Check interaction with branch doors
                if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
                    doors.forEach(door => {
                        if (
                            player.x < door.x + door.w &&
                            player.x + player.width > door.x &&
                            player.y < door.y + door.h &&
                            player.y + player.height > door.y
                        ) {
                            window.location.href = door.url;
                        }
                    });
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            function update() {
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    player.vx = -player.speed;
                } else if (keys['ArrowRight'] || keys['KeyD']) {
                    player.vx = player.speed;
                } else {
                    player.vx *= 0.8;
                }

                player.vy += gravity;

                if ((keys['ArrowUp'] || keys['Space'] || keys['KeyW']) && player.grounded) {
                    player.vy = player.jumpForce;
                    player.grounded = false;
                }

                player.x += player.vx;
                if (player.x < 0) player.x = 0;
                if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

                player.y += player.vy;
                player.grounded = false;

                platforms.forEach(plat => {
                    if (
                        player.x < plat.x + plat.w &&
                        player.x + player.width > plat.x &&
                        player.y + player.height > plat.y &&
                        player.y + player.height - player.vy <= plat.y + 5
                    ) {
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                });

                if (player.y + player.height > canvas.height) {
                    player.y = canvas.height - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }

            function draw() {
                ctx.fillStyle = "#00458a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Branch Doors
                doors.forEach(door => {
                    ctx.fillStyle = "#002b5c";
                    ctx.fillRect(door.x, door.y, door.w, door.h);
                    ctx.strokeStyle = "#FFFFFF";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(door.x, door.y, door.w, door.h);

                    ctx.fillStyle = "#FFFFFF";
                    ctx.font = "10px 'Courier New'";
                    ctx.textAlign = "center";
                    ctx.fillText(door.label, door.x + (door.w / 2), door.y - 8);
                });

                // Draw Platforms
                ctx.fillStyle = "#FFFFFF";
                platforms.forEach(plat => {
                    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                });

                // Draw Player
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(player.x, player.y, player.width, player.height);

                ctx.fillStyle = "#FFFFFF";
                ctx.font = "11px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("OPERATOR", player.x + (player.width / 2), player.y - 8);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            loop();
        }
    </script>
</body>
</html>
