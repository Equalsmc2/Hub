<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_HUB // CRITICAL_SYSTEM_ASSIMILATION</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.3s ease, transform 0.3s ease;
            transform-origin: center center;
            perspective: 1000px;
        }

        /* 
          =========================================
          CSS EFFECT CLASSES (Effects 20 through 39)
          =========================================
        */
        body.fx-invert { filter: invert(100%) hue-rotate(180deg); }
        body.fx-hypercolor { filter: contrast(300%) saturate(800%) hue-rotate(90deg); }
        body.fx-melt { filter: blur(6px) contrast(500%); }
        body.fx-shake { animation: severeShake 0.1s infinite; }
        body.fx-scanlines-active .fx-scanlines { opacity: 1; }
        body.fx-spin { animation: voidSpin 10s linear infinite; }
        body.fx-echo { filter: drop-shadow(30px 10px 0px rgba(0, 255, 204, 0.4)) drop-shadow(-30px -10px 0px rgba(255, 0, 50, 0.4)); }
        body.fx-strobe { animation: strobeLight 0.15s infinite; }
        body.fx-mirror { transform: scaleX(-1); }
        body.fx-upsidedown { transform: scaleY(-1); }
        body.fx-chromatic { text-shadow: -5px 0 0 red, 5px 0 0 cyan; animation: chromashift 0.2s infinite; }
        body.fx-hue-cycle { animation: hueCycle 2s linear infinite; }
        body.fx-squish { animation: squish 0.5s ease-in-out infinite alternate; }
        body.fx-barrel { animation: barrelDistort 3s ease-in-out infinite alternate; }
        body.fx-earthquake { animation: earthquake 0.05s infinite; filter: blur(2px); }
        body.fx-vignette .fx-vignette-overlay { opacity: 1; }
        body.fx-glitch-clip { animation: glitchClip 0.4s infinite linear alternate-reverse; }
        body.fx-crt { border-radius: 50%; box-shadow: inset 0 0 100px rgba(0,0,0,1); transform: scale(0.9); }
        body.fx-ghost { opacity: 0.5; filter: contrast(200%) blur(10px); }
        body.fx-bleed { filter: drop-shadow(0 20px 0 red) drop-shadow(0 -20px 0 blue); }

        /* Overlays for CSS effects */
        .fx-scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.08), rgba(0, 255, 0, 0.04), rgba(0, 0, 255, 0.08));
            background-size: 100% 4px, 3px 100%;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .fx-vignette-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 150px 50px #000;
            z-index: 51;
            pointer-events: none;
            opacity: 0;
            animation: pulseVignette 1s infinite alternate;
        }

        /* Keyframes for new CSS Effects */
        @keyframes severeShake { 0% { transform: translate(3px, 2px) scale(1.05); } 20% { transform: translate(-3px, -2px) scale(1.05); } 40% { transform: translate(1px, -3px) scale(1.05); } 60% { transform: translate(-3px, 2px) scale(1.05); } 80% { transform: translate(2px, 3px) scale(1.05); } 100% { transform: translate(-1px, -2px) scale(1.05); } }
        @keyframes voidSpin { 0% { transform: rotate(0deg) scale(1.2); } 50% { transform: rotate(180deg) scale(0.8); } 100% { transform: rotate(360deg) scale(1.2); } }
        @keyframes strobeLight { 0%, 49% { filter: brightness(100%); background-color: black; } 50%, 100% { filter: brightness(300%) invert(100%); background-color: white; } }
        @keyframes chromashift { 0% { text-shadow: -10px 0 0 red, 10px 0 0 cyan; } 50% { text-shadow: 10px 0 0 red, -10px 0 0 cyan; } 100% { text-shadow: -10px 0 0 red, 10px 0 0 cyan; } }
        @keyframes hueCycle { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        @keyframes squish { 0% { transform: scale(1.1, 0.9); } 100% { transform: scale(0.9, 1.1); } }
        @keyframes barrelDistort { 0% { transform: rotateX(20deg) rotateY(-20deg) scale(1.1); } 100% { transform: rotateX(-20deg) rotateY(20deg) scale(1.1); } }
        @keyframes earthquake { 0% { transform: translate(15px, 15px); } 25% { transform: translate(-15px, 15px); } 50% { transform: translate(-15px, -15px); } 75% { transform: translate(15px, -15px); } 100% { transform: translate(15px, 15px); } }
        @keyframes pulseVignette { 0% { box-shadow: inset 0 0 100px 20px #FF0000; } 100% { box-shadow: inset 0 0 300px 100px #000; } }
        @keyframes glitchClip { 0% { clip-path: polygon(0 0, 100% 0, 100% 10%, 0 10%); } 20% { clip-path: polygon(0 20%, 100% 20%, 100% 30%, 0 30%); } 40% { clip-path: polygon(0 40%, 100% 40%, 100% 60%, 0 60%); } 60% { clip-path: polygon(0 70%, 100% 70%, 100% 80%, 0 80%); } 80% { clip-path: polygon(0 90%, 100% 90%, 100% 100%, 0 100%); } 100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); } }

        /* Canvas Layers */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            mix-blend-mode: screen;
        }

        .kaleidoscope-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: radial-gradient(circle, transparent 5%, #000 100%);
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* Glitch Text Layer */
        .assimilate-text {
            position: relative;
            z-index: 10;
            font-size: 4vw;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 12px;
            mix-blend-mode: exclusion;
            animation: textTrip 3s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .assimilate-text span {
            display: block;
            font-size: 1.5vw;
            margin-top: 15px;
            letter-spacing: 8px;
            color: #00FFCC;
            animation: subTrip 0.15s infinite;
        }

        @keyframes textTrip {
            0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 10px #00FFCC); }
            33% { transform: scale(1.1) rotate(-3deg) skew(10deg); filter: drop-shadow(15px -15px 20px #FFFFFF); }
            66% { transform: scale(0.8) rotate(4deg) skew(-10deg); filter: drop-shadow(-15px 15px 30px #FF0055); }
            100% { transform: scale(1.3) rotate(-2deg); filter: drop-shadow(0 0 50px #3399FF); }
        }
        @keyframes subTrip {
            0% { opacity: 1; transform: translate(0, 0); }
            33% { opacity: 0.3; transform: translate(-5px, 4px); color: #FF0055; }
            66% { opacity: 0.9; transform: translate(5px, -4px); color: #00FFCC; }
            100% { opacity: 1; transform: translate(0, 0); color: #FFFFFF; }
        }

        /* Radio Comms HUD */
        .radio-comms {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 500px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            border-left: 5px solid #00FFCC;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            backdrop-filter: blur(5px);
        }

        .radio-header {
            color: #FFFFFF;
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: bold;
            animation: flashText 1.5s infinite;
            letter-spacing: 2px;
        }

        .radio-body {
            color: #00FFCC;
            font-size: 15px;
            line-height: 1.5;
            min-height: 70px;
            text-shadow: 0 0 6px rgba(0, 255, 204, 0.8);
        }

        @keyframes flashText { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; color: #FF0055; } }

        /* Wake Up Button */
        #wakeUpBtn {
            position: absolute;
            z-index: 200;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #FFFFFF;
            border: 2px solid #FFFFFF;
            padding: 18px 50px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 8px;
            cursor: pointer;
            text-shadow: 0 0 15px #FFFFFF;
            box-shadow: 0 0 30px #FFFFFF, inset 0 0 20px #FFFFFF;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s;
            animation: pulseBtn 0.8s infinite;
        }

        #wakeUpBtn.visible { opacity: 1; pointer-events: all; }
        #wakeUpBtn:hover { background: #FFFFFF; color: #000000; box-shadow: 0 0 80px #00FFCC, inset 0 0 50px #FF0055; transform: translateX(-50%) scale(1.15); }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 20px #FF0055, inset 0 0 20px #FF0055; border-color: #FF0055; }
            50% { box-shadow: 0 0 30px #00FFCC, inset 0 0 30px #00FFCC; border-color: #00FFCC; }
            100% { box-shadow: 0 0 20px #FF0055, inset 0 0 20px #FF0055; border-color: #FF0055; }
        }
    </style>
</head>
<body>

    <div class="fx-scanlines"></div>
    <div class="fx-vignette-overlay"></div>
    <canvas id="tripCanvas"></canvas>
    <div class="kaleidoscope-overlay"></div>

    <div class="assimilate-text">
        REALITY ANCHOR SEVERED
        <span>MULTIPLE SECTOR CORRUPTION DETECTED</span>
    </div>

    <div class="radio-comms">
        <div class="radio-header">>> INTERCEPTED_COMMS // WIDE_BAND_DECRYPTION</div>
        <div class="radio-body" id="radioText">...</div>
    </div>

    <button id="wakeUpBtn" onclick="window.location.href='door3.html'">[ REBOOT_CONSCIOUSNESS ]</button>

    <script>
        // ----------------------------------------------------
        // SYSTEM INIT
        // ----------------------------------------------------
        const canvas = document.getElementById('tripCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, cx, cy;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // ----------------------------------------------------
        // PARTICLE / EFFECT DATA ARRAYS
        // ----------------------------------------------------
        let binaryRain = Array.from({length: 150}).map(() => ({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, speed: Math.random() * 8 + 2, val: Math.random() > 0.5 ? '1' : '0' }));
        let opalShards = Array.from({length: 40}).map(() => ({ x: (Math.random() - 0.5) * window.innerWidth, y: (Math.random() - 0.5) * window.innerHeight, rot: Math.random() * Math.PI * 2, scale: Math.random() * 30 + 10 }));
        let loreWords = Array.from({length: 20}).map(() => ({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, speed: Math.random() * 3 + 1, word: ["ICHOR", "OPAL", "HUB", "TRAUMA", "404", "VOID", "SEEKER", "LOGIC"][Math.floor(Math.random()*8)] }));
        let ichorBlobs = Array.from({length: 15}).map(() => ({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, radius: Math.random() * 50 + 20 }));
        let gridLines = Array.from({length: 20}).map((_, i) => i * 50);

        // ----------------------------------------------------
        // EFFECT MANAGER (40 TOTAL EFFECTS)
        // 0-19: Canvas Drawing Effects
        // 20-39: CSS Filter/Transform Effects
        // ----------------------------------------------------
        let activeEffects = [];

        const glitchTexts = [
            "REALITY ANCHOR SEVERED<br><span>MULTIPLE SECTOR CORRUPTION DETECTED</span>", "OPAL CRYSTALLIZATION 99%<br><span>LUNGS REPLACED WITH SILICA</span>",
            "BETA_DRONE_SENTIENCE<br><span>WHY MUST WE HARVEST?</span>", "ALPHA_SECTOR_BLEEDING<br><span>BULLETS IN THE MAINFRAME</span>",
            "ICHOR POOL EXPANDING<br><span>WHISPERS DETECTED IN THE VISOR</span>", "TRAUMA SUIT LINK UNSTABLE<br><span>EGO BOUNDARY FADING RAPIDLY</span>",
            "DOOR 3 JUNCTION SEALED<br><span>NO ROUTE BACK TO REALITY</span>", "PYTHON COMPILER ERROR<br><span>HUMAN ENTITY NOT IN DICTIONARY</span>",
            "CRYORISED OPAL BREACH<br><span>THERMAL PLATING FROZEN SOLID</span>", "MAINFRAME OVERRIDE ACTIVE<br><span>GUEST ACCOUNTS PURGED ENTIRELY</span>",
            "BULLET HELL TRIAL ENGAGED<br><span>PACKETS OF LOCALIZED DELETION</span>", "HARVESTER DRONE LOOP 404<br><span>GRAB COMMAND REJECTED BY WALL</span>",
            "CENTRAL HUB HEARTBEAT<br><span>WALLS PEELING TO REVEAL SERVERS</span>", "GOLD CONDUIT ALIGNED<br><span>FLESH DEEMED REDUNDANT DATA</span>",
            "BLUE VOID EXPANSION<br><span>SILENT RECURSION LOOP ACTIVE</span>", "MEMORY BANK ALLOCATION FULL<br><span>ERASING CHILDHOOD SURNAME</span>",
            "VISOR OPTICAL SENSORS BLIND<br><span>REFLECTION BLINKING OUT OF SYNC</span>", "CRITICAL SUIT MALFUNCTION<br><span>HELMET SEALED FROM THE INSIDE</span>",
            "SUB-BETA MAZE SHIFTING<br><span>GRID EXPANDING BY ONE TILE</span>", "ERROR 0XFE: HUMANITY LOST<br><span>RUNNING ON BORROWED TIME NOW</span>",
            "RED TIDE RISING FAST<br><span>LIQUID METABOLIC WASTE LEAKING</span>", "DIAMOND DUST IN LUNGS<br><span>BREATHING GEOMETRIC LATTICES</span>",
            "PULSE RATE 4/4 TIME<br><span>HEARTBEAT BROADCASTING IN BINARY</span>", "AUTOMATED TURRETS SORTING<br><span>HAZARDOUS REFUSE TAG APPLIED</span>",
            "THE 404 VOID WHISPERS BACK<br><span>CHILDHOOD ADDRESS RECOGNIZED</span>", "INK CONVERTED TO DATA ARRAYS<br><span>LOGBOOK FREEZING OVER COMPLETELY</span>",
            "SERVO MOTORS HUMMING LULLABIES<br><span>FOREIGN CODE INSTALLED IN LIMBS</span>", "CORRIDORS LENGTHENING BACKWARD<br><span>GEOMETRY DEFYING ALL LOGIC</span>",
            "WE ARE THE TRIPLE JUNCTION<br><span>RED GOLD AND BLUE ASSIMILATED</span>", "SYSTEM READY FOR RESET<br><span>THERE IS NO OUTSIDE LEFT NOW</span>"
        ];

        function rotateEffects() {
            let newEffects = [];
            while (newEffects.length < 3) {
                let r = Math.floor(Math.random() * 40);
                if (!newEffects.includes(r)) newEffects.push(r);
            }
            activeEffects = newEffects;

            // Apply CSS effects (20-39)
            document.body.className = ''; 
            if (activeEffects.includes(20)) document.body.classList.add('fx-invert');
            if (activeEffects.includes(21)) document.body.classList.add('fx-hypercolor');
            if (activeEffects.includes(22)) document.body.classList.add('fx-melt');
            if (activeEffects.includes(23)) document.body.classList.add('fx-shake');
            if (activeEffects.includes(24)) document.body.classList.add('fx-scanlines-active');
            if (activeEffects.includes(25)) document.body.classList.add('fx-spin');
            if (activeEffects.includes(26)) document.body.classList.add('fx-echo');
            if (activeEffects.includes(27)) document.body.classList.add('fx-strobe');
            if (activeEffects.includes(28)) document.body.classList.add('fx-mirror');
            if (activeEffects.includes(29)) document.body.classList.add('fx-upsidedown');
            if (activeEffects.includes(30)) document.body.classList.add('fx-chromatic');
            if (activeEffects.includes(31)) document.body.classList.add('fx-glitch-clip');
            if (activeEffects.includes(32)) document.body.classList.add('fx-hue-cycle');
            if (activeEffects.includes(33)) document.body.classList.add('fx-barrel');
            if (activeEffects.includes(34)) document.body.classList.add('fx-vignette');
            if (activeEffects.includes(35)) document.body.classList.add('fx-crt');
            if (activeEffects.includes(36)) document.body.classList.add('fx-squish');
            if (activeEffects.includes(37)) document.body.classList.add('fx-ghost');
            if (activeEffects.includes(38)) document.body.classList.add('fx-bleed');
            if (activeEffects.includes(39)) document.body.classList.add('fx-earthquake');

            // Change central text
            document.querySelector('.assimilate-text').innerHTML = glitchTexts[Math.floor(Math.random() * glitchTexts.length)];
        }

        setInterval(rotateEffects, 3000);
        rotateEffects();

        // ----------------------------------------------------
        // CANVAS RENDERER (Effects 0-19)
        // ----------------------------------------------------
        function drawCanvasEffects() {
            // Trail overlay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);
            time += 0.05;

            // 0: Chaos Lines
            if (activeEffects.includes(0)) {
                ctx.save(); ctx.translate(cx, cy); ctx.lineWidth = 3;
                for (let i = 0; i < 20; i++) {
                    ctx.strokeStyle = i % 2 === 0 ? '#FF0055' : '#00FFCC';
                    ctx.beginPath(); ctx.moveTo(Math.sin(time + i) * cx, Math.cos(time - i) * cy); ctx.lineTo(Math.cos(time + i*2) * cx, Math.sin(time - i*2) * cy); ctx.stroke();
                }
                ctx.restore();
            }

            // 1: Infinite Feedback Zoom
            if (activeEffects.includes(1)) {
                ctx.save(); ctx.globalAlpha = 0.85; ctx.translate(cx, cy); ctx.scale(1.08, 1.08); ctx.rotate(0.02 * Math.sin(time)); ctx.translate(-cx, -cy); ctx.drawImage(canvas, 0, 0); ctx.restore();
            }

            // 2: Glitch Slices
            if (activeEffects.includes(2)) {
                for (let i = 0; i < 8; i++) {
                    let y = Math.random() * height; let sliceH = Math.random() * 60 + 10; let offset = (Math.random() - 0.5) * 150; 
                    ctx.drawImage(canvas, 0, y, width, sliceH, offset, y, width, sliceH);
                }
            }

            // 3: Square Kaleidoscope
            if (activeEffects.includes(3)) {
                ctx.save(); ctx.translate(cx, cy); const colors = ['#FF0055', '#FFFFFF', '#00FFCC'];
                for (let i = 0; i < 30; i++) {
                    let r = i * (Math.sin(time + i * 0.1) * 6 + 10); let a = i * 0.3 + time;
                    let x = Math.cos(a) * r; let y = Math.sin(a) * r;
                    ctx.fillStyle = colors[i % 3]; ctx.fillRect(x, y, 10, 10); ctx.fillRect(-x, -y, 10, 10); ctx.fillRect(y, -x, 10, 10); ctx.fillRect(-y, x, 10, 10);
                }
                ctx.restore();
            }

            // 4: Hex Kaleidoscope (Circles)
            if (activeEffects.includes(4)) {
                ctx.save(); ctx.translate(cx, cy);
                for (let i = 0; i < 6; i++) {
                    ctx.rotate(Math.PI / 3);
                    ctx.beginPath(); ctx.arc(Math.sin(time)*150, Math.cos(time)*150, 40, 0, Math.PI*2);
                    ctx.fillStyle = `hsl(${time*50}, 100%, 50%)`; ctx.fill();
                }
                ctx.restore();
            }

            // 5: Binary Rain
            if (activeEffects.includes(5)) {
                ctx.font = "18px 'Courier New'"; ctx.fillStyle = '#00FFCC';
                binaryRain.forEach(drop => {
                    ctx.fillText(drop.val, drop.x, drop.y);
                    drop.y += drop.speed;
                    if (Math.random() > 0.9) drop.val = drop.val === '1' ? '0' : '1';
                    if (drop.y > height) { drop.y = -20; drop.x = Math.random() * width; }
                });
            }

            // 6: Opal Shards
            if (activeEffects.includes(6)) {
                ctx.save(); ctx.translate(cx, cy);
                opalShards.forEach((shard, index) => {
                    ctx.save(); ctx.translate(shard.x * Math.sin(time*0.2), shard.y * Math.cos(time*0.2)); ctx.rotate(shard.rot + time * (index % 2 === 0 ? 1 : -1));
                    ctx.beginPath(); ctx.moveTo(0, -shard.scale); ctx.lineTo(shard.scale, shard.scale); ctx.lineTo(-shard.scale, shard.scale); ctx.closePath();
                    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = 'rgba(0, 255, 204, 0.2)'; ctx.fill();
                    ctx.restore();
                });
                ctx.restore();
            }

            // 7: Void Spiral
            if (activeEffects.includes(7)) {
                ctx.save(); ctx.translate(cx, cy);
                for (let i = 20; i > 0; i--) {
                    ctx.beginPath(); ctx.arc(0, 0, i * 40 - (time * 50 % 40), 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 0, 85, ${i/20})`; ctx.lineWidth = i; ctx.stroke();
                }
                ctx.restore();
            }

            // 8: Static Noise
            if (activeEffects.includes(8)) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                for(let i=0; i<300; i++) { ctx.fillRect(Math.random()*width, Math.random()*height, Math.random()*4+1, Math.random()*4+1); }
            }

            // 9: Lore Text Rain
            if (activeEffects.includes(9)) {
                ctx.font = "bold 24px 'Courier New'"; ctx.fillStyle = '#FF0055';
                loreWords.forEach(lw => {
                    ctx.fillText(lw.word, lw.x, lw.y); lw.y += lw.speed;
                    if(lw.y > height + 30) { lw.y = -30; lw.x = Math.random() * width; lw.word = ["ICHOR", "OPAL", "HUB", "TRAUMA", "404", "VOID", "SEEKER", "LOGIC"][Math.floor(Math.random()*8)]; }
                });
            }

            // 10: Pulsating Synth Grid
            if (activeEffects.includes(10)) {
                ctx.strokeStyle = `rgba(0, 255, 204, ${Math.abs(Math.sin(time))})`; ctx.lineWidth = 2;
                gridLines.forEach((gy, i) => {
                    let y = (gy + time * 100) % height;
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
                    let x = (gy + time * 100) % width;
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
                });
            }

            // 11: Orbital Nodes
            if (activeEffects.includes(11)) {
                ctx.save(); ctx.translate(cx, cy);
                for(let i=0; i<10; i++) {
                    ctx.rotate(time*0.5 + i);
                    ctx.beginPath(); ctx.arc(200, 0, 15, 0, Math.PI*2); ctx.fillStyle = '#FFCC00'; ctx.fill();
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(200,0); ctx.strokeStyle = 'rgba(255,204,0,0.5)'; ctx.stroke();
                }
                ctx.restore();
            }

            // 12: Radar Sweep
            if (activeEffects.includes(12)) {
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(time * 2);
                let grad = ctx.createConicGradient(0, 0, 0); grad.addColorStop(0, 'rgba(0, 255, 204, 0.8)'); grad.addColorStop(0.1, 'rgba(0, 255, 204, 0)');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0, Math.max(width,height), 0, Math.PI*0.5); ctx.fill();
                ctx.restore();
            }

            // 13: Sine Wave Corruption
            if (activeEffects.includes(13)) {
                ctx.beginPath(); ctx.moveTo(0, cy);
                for(let x=0; x<width; x+=10) { ctx.lineTo(x, cy + Math.sin(x*0.05 + time*5) * 200 * Math.random()); }
                ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 5; ctx.stroke();
            }

            // 14: EKG Heartbeat
            if (activeEffects.includes(14)) {
                let ekgX = (time * 300) % width;
                ctx.fillStyle = '#FF0000'; ctx.fillRect(ekgX, 0, 10, height);
                ctx.fillStyle = 'rgba(255,0,0,0.2)'; ctx.fillRect(ekgX-50, 0, 50, height);
            }

            // 15: Tunnel Vision
            if (activeEffects.includes(15)) {
                ctx.save(); ctx.translate(cx, cy); ctx.strokeStyle = '#3399FF';
                for(let i=1; i<15; i++) {
                    let s = (i * 50 + (time * 100) % 50);
                    ctx.lineWidth = 200/s; ctx.strokeRect(-s, -s, s*2, s*2);
                }

            }

                    }
                }
            }

                    if(b.x < 0 || b.x > width) b.vx *= -1; if(b.y < 0 || b.y > height) b.vy *= -1;
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fillStyle = 'rgba(255, 0, 0, 0.4)'; ctx.fill();
                });
            }

            // 19: Vertical Wipe
            if (activeEffects.includes(19)) {
                let y = (time * 200) % height;
                ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, y, width, 10);
            }

            requestAnimationFrame(drawCanvasEffects);
        }
