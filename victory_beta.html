<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_HUB // CRITICAL_SYSTEM_ASSIMILATION</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.3s ease, transform 0.3s ease;
            transform-origin: center center;
        }

        /* 
          =========================================
          CSS EFFECT CLASSES (Effects 5 through 11)
          =========================================
        */
        body.fx-invert { filter: invert(100%) hue-rotate(180deg); }
        body.fx-hypercolor { filter: contrast(300%) saturate(800%) hue-rotate(90deg); }
        body.fx-melt { filter: blur(6px) contrast(500%); }
        body.fx-shake { animation: severeShake 0.1s infinite; }
        body.fx-spin { animation: voidSpin 8s linear infinite; }
        body.fx-echo { filter: drop-shadow(30px 10px 0px rgba(0, 255, 204, 0.4)) drop-shadow(-30px -10px 0px rgba(255, 0, 50, 0.4)); }
        body.fx-strobe { animation: strobeLight 0.2s infinite; }
        
        .fx-scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.08), rgba(0, 255, 0, 0.04), rgba(0, 0, 255, 0.08));
            background-size: 100% 4px, 3px 100%;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        body.fx-scanlines-active .fx-scanlines { opacity: 1; }

        @keyframes severeShake {
            0% { transform: translate(3px, 2px) rotate(0deg) scale(1.05); }
            20% { transform: translate(-3px, -2px) rotate(-1deg) scale(1.05); }
            40% { transform: translate(1px, -3px) rotate(1deg) scale(1.05); }
            60% { transform: translate(-3px, 2px) rotate(-2deg) scale(1.05); }
            80% { transform: translate(2px, 3px) rotate(2deg) scale(1.05); }
            100% { transform: translate(-1px, -2px) rotate(-1deg) scale(1.05); }
        }

        @keyframes voidSpin {
            0% { transform: rotate(0deg) scale(1.2); }
            50% { transform: rotate(180deg) scale(0.8); }
            100% { transform: rotate(360deg) scale(1.2); }
        }

        @keyframes strobeLight {
            0%, 49% { filter: brightness(100%) contrast(100%); }
            50%, 100% { filter: brightness(300%) contrast(300%) invert(100%); }
        }

        /* Canvas Layers */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            mix-blend-mode: screen;
        }

        .kaleidoscope-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: radial-gradient(circle, transparent 5%, #000 100%);
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* Central Glitch Text */
        .assimilate-text {
            position: relative;
            z-index: 10;
            font-size: 4vw;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 12px;
            mix-blend-mode: exclusion;
            animation: textTrip 3s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .assimilate-text span {
            display: block;
            font-size: 1.5vw;
            margin-top: 15px;
            letter-spacing: 8px;
            color: #00FFCC;
            animation: subTrip 0.15s infinite;
        }

        @keyframes textTrip {
            0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 10px #00FFCC); }
            33% { transform: scale(1.1) rotate(-3deg) skew(10deg); filter: drop-shadow(15px -15px 20px #FFFFFF); }
            66% { transform: scale(0.8) rotate(4deg) skew(-10deg); filter: drop-shadow(-15px 15px 30px #FF0055); }
            100% { transform: scale(1.3) rotate(-2deg); filter: drop-shadow(0 0 50px #3399FF); }
        }

        @keyframes subTrip {
            0% { opacity: 1; transform: translate(0, 0); }
            33% { opacity: 0.3; transform: translate(-5px, 4px); color: #FF0055; }
            66% { opacity: 0.9; transform: translate(5px, -4px); color: #00FFCC; }
            100% { opacity: 1; transform: translate(0, 0); color: #FFFFFF; }
        }

        /* Radio Comms HUD */
        .radio-comms {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 500px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            border-left: 5px solid #00FFCC;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            backdrop-filter: blur(5px);
        }

        .radio-header {
            color: #FFFFFF;
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: bold;
            animation: flashText 1.5s infinite;
            letter-spacing: 2px;
        }

        .radio-body {
            color: #00FFCC;
            font-size: 15px;
            line-height: 1.5;
            min-height: 70px;
            text-shadow: 0 0 6px rgba(0, 255, 204, 0.8);
        }

        @keyframes flashText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; color: #FF0055; }
        }

        /* Wake Up Button */
        #wakeUpBtn {
            position: absolute;
            z-index: 200;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #FFFFFF;
            border: 2px solid #FFFFFF;
            padding: 18px 50px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 8px;
            cursor: pointer;
            text-shadow: 0 0 15px #FFFFFF;
            box-shadow: 0 0 30px #FFFFFF, inset 0 0 20px #FFFFFF;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s;
            animation: pulseBtn 0.8s infinite;
        }

        #wakeUpBtn.visible {
            opacity: 1;
            pointer-events: all;
        }

        #wakeUpBtn:hover {
            background: #FFFFFF;
            color: #000000;
            box-shadow: 0 0 80px #00FFCC, inset 0 0 50px #FF0055;
            transform: translateX(-50%) scale(1.15);
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 20px #FF0055, inset 0 0 20px #FF0055; border-color: #FF0055; }
            50% { box-shadow: 0 0 30px #00FFCC, inset 0 0 30px #00FFCC; border-color: #00FFCC; }
            100% { box-shadow: 0 0 20px #FF0055, inset 0 0 20px #FF0055; border-color: #FF0055; }
        }
    </style>
</head>
<body>

    <div class="fx-scanlines"></div>
    <canvas id="tripCanvas"></canvas>
    <div class="kaleidoscope-overlay"></div>

    <div class="assimilate-text">
        REALITY ANCHOR SEVERED

    </div>

        <div class="radio-body" id="radioText">...</div>
    </div>

    <button id="wakeUpBtn" onclick="window.location.href='door3.html'">[ REBOOT_CONSCIOUSNESS ]</button>

    <script>
        /* 
           THE 16-STAGE HALLUCINATION ENGINE
           0-4: Canvas Manipulation (Geometry, Fractals, Glitches)
           12-15: Advanced Canvas Lore Effects (Opal, Logic, Void)
           5-11: CSS Manipulation (Melt, Spin, Echo, Strobe, etc.)
           Exactly 3 run simultaneously, rotating randomly every 3 seconds.
        */

        const canvas = document.getElementById('tripCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, cx, cy;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Data arrays for particle systems
        let binaryRain = Array.from({length: 150}).map(() => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            speed: Math.random() * 8 + 2,
            val: Math.random() > 0.5 ? '1' : '0'
        }));

        let opalShards = Array.from({length: 40}).map(() => ({
            x: (Math.random() - 0.5) * window.innerWidth,
            y: (Math.random() - 0.5) * window.innerHeight,
            rot: Math.random() * Math.PI * 2,
            scale: Math.random() * 30 + 10
        }));

        // ---------------------------------------------
        // ACTIVE EFFECTS MANAGER
        // ---------------------------------------------
        let activeEffects = [];

        function rotateEffects() {
            // Pick 3 random unique effects from 0 to 15
            let newEffects = [];
            while (newEffects.length < 3) {
                let r = Math.floor(Math.random() * 16);
                if (!newEffects.includes(r)) newEffects.push(r);
            }
            activeEffects = newEffects;

            // Apply CSS classes based on active effects
            document.body.className = ''; 
            if (activeEffects.includes(5)) document.body.classList.add('fx-invert');
            if (activeEffects.includes(6)) document.body.classList.add('fx-hypercolor');
            if (activeEffects.includes(7)) document.body.classList.add('fx-melt');
            if (activeEffects.includes(8)) document.body.classList.add('fx-shake');
            if (activeEffects.includes(9)) document.body.classList.add('fx-scanlines-active');
            if (activeEffects.includes(10)) document.body.classList.add('fx-spin');
            if (activeEffects.includes(11)) document.body.classList.add('fx-echo');
            // Strobe is highly aggressive, only trigger if it's the exact roll and combined with melt for safety
            if (activeEffects.includes(15)) document.body.classList.add('fx-strobe');

            // Optional: Randomize the main text slightly based on the rotation
            const glitchTexts = [
                "REALITY ANCHOR SEVERED<br><span>MULTIPLE SECTOR CORRUPTION DETECTED</span>",
                "OPAL CRYSTALLIZATION 99%<br><span>LUNGS REPLACED WITH SILICA</span>",
                "BETA_DRONE_SENTIENCE<br><span>WHY MUST WE HARVEST?</span>",
                "ALPHA_SECTOR_BLEEDING<br><span>BULLETS IN THE MAINFRAME</span>"
            ];
            document.querySelector('.assimilate-text').innerHTML = glitchTexts[Math.floor(Math.random() * glitchTexts.length)];
        }

        // Rotate effects every 3.2 seconds
        setInterval(rotateEffects, 3200);
        rotateEffects();


        // ---------------------------------------------
        // CANVAS EFFECT RENDERERS
        // ---------------------------------------------
        function drawCanvasEffects() {
            // Base layer with slight fade for motion trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);
            time += 0.05;

            // Effect 0: Chaos Lines
            if (activeEffects.includes(0)) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.lineWidth = 3;
                for (let i = 0; i < 20; i++) {
                    ctx.strokeStyle = i % 2 === 0 ? '#FF0055' : '#00FFCC';
                    ctx.beginPath();
                    ctx.moveTo(Math.sin(time + i) * cx, Math.cos(time - i) * cy);
                    ctx.lineTo(Math.cos(time + i*2) * cx, Math.sin(time - i*2) * cy);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Effect 1: Infinite Feedback Zoom
            if (activeEffects.includes(1)) {
                ctx.save();
                ctx.globalAlpha = 0.85;
                ctx.translate(cx, cy);
                ctx.scale(1.08, 1.08); 
                ctx.rotate(0.02 * Math.sin(time)); 
                ctx.translate(-cx, -cy);
                ctx.drawImage(canvas, 0, 0);
                ctx.restore();
            }

            // Effect 2: Sector Alpha Glitch Slices
            if (activeEffects.includes(2)) {
                for (let i = 0; i < 8; i++) {
                    let y = Math.random() * height;
                    let sliceH = Math.random() * 60 + 10;
                    let offset = (Math.random() - 0.5) * 150; 
                    ctx.drawImage(canvas, 0, y, width, sliceH, offset, y, width, sliceH);
                }
            }

            // Effect 12: Sector Beta Binary / Logic Cascades
            if (activeEffects.includes(12)) {
                ctx.font = "18px 'Courier New'";
                ctx.fillStyle = '#00FFCC';
                binaryRain.forEach(drop => {
                    ctx.fillText(drop.val, drop.x, drop.y);
                    drop.y += drop.speed;
                    // Randomly swap binary values
                    if (Math.random() > 0.9) drop.val = drop.val === '1' ? '0' : '1';
                    if (drop.y > height) {
                        drop.y = -20;
                        drop.x = Math.random() * width;
                    }
                });
            }

            // Effect 13: Cryorised Opal Shards
            if (activeEffects.includes(13)) {
                ctx.save();
                ctx.translate(cx, cy);
                opalShards.forEach((shard, index) => {
                    ctx.save();
                    ctx.translate(shard.x * Math.sin(time*0.2), shard.y * Math.cos(time*0.2));
                    ctx.rotate(shard.rot + time * (index % 2 === 0 ? 1 : -1));
                    ctx.beginPath();
                    ctx.moveTo(0, -shard.scale);
                    ctx.lineTo(shard.scale, shard.scale);
                    ctx.lineTo(-shard.scale, shard.scale);
                    ctx.closePath();
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(0, 255, 204, 0.2)';
                    ctx.fill();
                    ctx.restore();
                });
                ctx.restore();
            }

            // Effect 14: The Void Spiral (Hub Collapse)
            if (activeEffects.includes(14)) {
                ctx.save();
                ctx.translate(cx, cy);
                for (let i = 20; i > 0; i--) {
                    ctx.beginPath();
                    ctx.arc(0, 0, i * 40 - (time * 50 % 40), 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 0, 85, ${i/20})`;
                    ctx.lineWidth = i;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Effect 3/4: Kaleidoscope Core (Legacy from prior iteration)
            if (activeEffects.includes(3) || activeEffects.includes(4)) {
                ctx.save();
                ctx.translate(cx, cy);
                const colors = ['#FF0055', '#FFFFFF', '#00FFCC'];
                for (let i = 0; i < 30; i++) {
                    let radius = i * (Math.sin(time + i * 0.1) * 6 + 10);
                    let angle = i * 0.3 + time;
                    let x = Math.cos(angle) * radius;
                    let y = Math.sin(angle) * radius;
                    ctx.fillStyle = colors[i % 3];
                    ctx.fillRect(x, y, 10, 10);
                    ctx.fillRect(-x, -y, 10, 10);
                    ctx.fillRect(y, -x, 10, 10);
                    ctx.fillRect(-y, x, 10, 10);
                }
                ctx.restore();
            }

            requestAnimationFrame(drawCanvasEffects);
        }

        drawCanvasEffects();


        // ---------------------------------------------
        // LORE: EXPANDED RADIO COMMS

    "[SEEKER_MIA]: I saw someone standing at the end of the 404 void corridor. But when I got closer, it was just my own shadow frozen in time.",
    "[PILOT_ORL]: The Hub isn't a building. It's a digestive tract for lost data packets.",
    "[DEBRIS_NOTE]: Abandoned terminals across the Hub are all displaying the exact same three words: 'WE ARE READY.'",
    "[SYSTEM_WARN]: Warning: Hub integrity compromised by unauthorized seeker movement.",
    "[UNKNOWN]: Who keeps turning off the lights in the junction? The dark here feels thick, like liquid ink.",
    "[LOG_44]: The Hub mainframe is learning how to dream. And its dreams are leaking into our sector.",
    "[BROADCAST_FINAL]: End of transmission. The Hub has absorbed the signal. There is no outside left."
        ];
        

        let radioBox = document.getElementById('radioText');
        let currentLine = "";
        let charIndex = 0;
        let isTyping = false;

        function typeRadioMessage() {
            if (!isTyping) {
                // Pick a random lore line
                let rawLine = radioLines[Math.floor(Math.random() * radioLines.length)];
                
                // Add sporadic heavy glitching to the text string
                currentLine = rawLine.split('').map(c => Math.random() < 0.04 ? '█▓▒░'[Math.floor(Math.random()*4)] : c).join('');
                
                radioBox.innerHTML = "";
                charIndex = 0;
                isTyping = true;
            }

            if (isTyping) {
                radioBox.innerHTML += currentLine.charAt(charIndex);
                charIndex++;

                if (charIndex < currentLine.length) {
                    setTimeout(typeRadioMessage, Math.random() * 25 + 10); // Typewriter speed
                } else {
                    isTyping = false;
                    setTimeout(typeRadioMessage, 3500); // Wait before intercepting next comm
                }
            }
        }

        // Initialize communications
        setTimeout(typeRadioMessage, 800);


        // ---------------------------------------------
        // WAKE UP ESCAPE MECHANISM
        // ---------------------------------------------
        setTimeout(() => {
            document.getElementById('wakeUpBtn').classList.add('visible');
        }, 12000); // Escape button appears after 12 seconds of intense sensory overload

    </script>
